<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>会議室予約</title>
  <style>
    :root{
      --navy:#0B3A66;
      --navy2:#124A7A;
      --bg:#F5F7FB;
      --card:#FFFFFF;
      --line:#CBD5E1;
      --line-light:#E2E8F0;
      --muted:#6B7280;
      --text:#111827;
      --shadow: 0 4px 12px rgba(17,24,39,.06);
      --radius: 8px;
    }
    *{box-sizing:border-box;margin:0;padding:0}
    body{
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans JP", "Hiragino Kaku Gothic ProN", Meiryo, sans-serif;
      color:var(--text);
      background:var(--bg);
      min-height:100vh;
    }

    /* Header */
    .topbar{
      background: linear-gradient(90deg, var(--navy), var(--navy2));
      color:#fff;
      padding:12px 16px;
      position:sticky;
      top:0;
      z-index:100;
      box-shadow: 0 4px 12px rgba(0,0,0,.15);
    }
    .topbar-inner{
      max-width:1400px;
      margin:0 auto;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      flex-wrap:wrap;
    }
    .brand{
      display:flex;
      align-items:center;
      gap:10px;
      font-weight:800;
      font-size:16px;
    }
    /* LINE WORKS テキストロゴ */
    .lineworks-logo{
      font-family:'Arial Black','Helvetica Neue',Arial,sans-serif;
      font-weight:900;
      letter-spacing:0.02em;
      white-space:nowrap;
    }
    .lineworks-logo.logo-sm{font-size:20px}
    .lineworks-logo.logo-lg{font-size:36px}
    .lineworks-logo.logo-white{color:#fff}
    .lineworks-logo.logo-blue{color:#1a4b8c}
    .badge{
      font-size:11px;
      padding:3px 8px;
      border:1px solid rgba(255,255,255,.3);
      border-radius:999px;
      opacity:.9;
    }

    /* Portal Link */
    .portal-link{
      display:inline-block;
      font-size:13px;
      padding:6px 12px;
      border-radius:8px;
      border:1px solid #1f9d55;
      background:#1f9d55;
      color:#fff;
      text-decoration:none;
      font-weight:500;
      white-space:nowrap;
    }
    .portal-link:hover{
      background:#177a43;
      border-color:#177a43;
      color:#fff;
      text-decoration:none;
    }

    /* Week Tabs */
    .week-tabs{
      display:flex;
      gap:4px;
      flex-wrap:wrap;
    }
    .week-tab{
      background:rgba(255,255,255,.1);
      border:1px solid rgba(255,255,255,.2);
      color:#fff;
      padding:6px 10px;
      border-radius:8px;
      cursor:pointer;
      font-size:12px;
      font-weight:700;
      transition:.15s;
      text-align:center;
      min-width:70px;
    }
    .week-tab:hover{background:rgba(255,255,255,.2)}
    .week-tab.active{
      background:#fff;
      color:var(--navy);
      border-color:#fff;
    }
    .week-tab .date{font-size:13px;font-weight:800}
    .week-tab .count{font-size:10px;opacity:.85;margin-top:2px}

    /* Modal Date Tabs (7-day picker) */
    .date-tabs{
      display:flex;
      gap:6px;
      flex-wrap:wrap;
    }
    .date-tab{
      flex:1 1 auto;
      min-width:54px;
      padding:8px 4px;
      border:2px solid var(--line);
      border-radius:6px;
      background:#fff;
      color:var(--text);
      cursor:pointer;
      text-align:center;
      line-height:1.3;
      transition:all .12s ease;
      font-family:inherit;
    }
    .date-tab:hover{
      border-color:var(--navy);
      background:#F0F7FF;
    }
    .date-tab.active{
      background:var(--navy);
      color:#fff;
      border-color:var(--navy);
    }
    .date-tab .date-num{font-size:14px;font-weight:800}
    .date-tab .date-dow{font-size:10px;opacity:.85;margin-top:2px}
    .date-tab.out-of-range{
      border-color:#F59E0B;
      background:#FEF3C7;
      color:#92400E;
    }
    .date-tab.out-of-range.active{
      background:#F59E0B;
      color:#fff;
      border-color:#F59E0B;
    }

    /* Main Container */
    .container{
      max-width:1400px;
      margin:0 auto;
      padding:16px;
    }

    /* Day Info */
    .day-info{
      display:flex;
      align-items:center;
      justify-content:space-between;
      margin-bottom:12px;
      flex-wrap:wrap;
      gap:8px;
    }
    .day-title{
      font-size:18px;
      font-weight:900;
      color:var(--navy);
    }
    .day-nav{
      display:flex;
      gap:6px;
    }
    .nav-btn{
      background:#fff;
      border:1px solid var(--line);
      padding:6px 12px;
      border-radius:6px;
      cursor:pointer;
      font-weight:700;
      font-size:12px;
      transition:.15s;
    }
    .nav-btn:hover{background:var(--bg)}

    /* Grid Table (Excel-like) */
    .grid-wrap{
      background:#fff;
      border:1px solid var(--line);
      border-radius:var(--radius);
      overflow:auto;
      box-shadow:var(--shadow);
    }
    .day-grid{
      display:grid;
      grid-template-columns: 70px repeat(var(--room-count), 1fr);
      min-width:500px;
    }
    .grid-cell{
      border-right:1px solid var(--line);
      border-bottom:1px solid var(--line);
      padding:0;
      min-height:40px;
      position:relative;
      background:#fff;
    }
    .grid-cell:last-child{border-right:none}
    .grid-cell.room-col:last-child{border-right:3px solid var(--room-color, var(--line))}
    .grid-row:last-child .grid-cell{border-bottom:none}

    /* Room column border (applied via inline style --room-color) */
    .grid-cell.room-col{
      border-left:3px solid var(--room-color, var(--line));
      border-right:3px solid var(--room-color, var(--line));
    }

    /* Header Row */
    .grid-header{
      background:var(--navy);
      color:#fff;
      font-weight:800;
      font-size:13px;
      text-align:center;
      display:flex;
      align-items:center;
      justify-content:center;
      min-height:44px;
      border-bottom:2px solid var(--navy2) !important;
    }
    .grid-header.room-header{
      cursor:pointer;
      transition:background .15s;
      background:var(--room-color, var(--navy));
      color:#1e293b;
      border-left:3px solid var(--room-color, var(--navy));
      border-right:3px solid var(--room-color, var(--navy));
      border-bottom:2px solid rgba(0,0,0,.15) !important;
    }
    .grid-header.room-header:hover{
      filter:brightness(.92);
    }
    .grid-header.room-header.selected{
      outline:3px solid #2563EB;
      outline-offset:-3px;
      box-shadow:inset 0 -3px 0 #FFD700;
    }

    /* Welcome Auto Toggle Bar */
    .welcome-auto-bar{
      display:none;
      align-items:center;
      justify-content:space-between;
      background:linear-gradient(90deg, #059669, #10B981);
      color:#fff;
      padding:10px 16px;
      border-radius:8px;
      margin-bottom:12px;
      box-shadow:0 4px 12px rgba(16,185,129,.25);
    }
    .welcome-auto-bar.show{display:flex}
    .welcome-auto-bar .room-name{
      font-weight:800;
      font-size:14px;
    }
    .welcome-auto-bar .toggle-wrap{
      display:flex;
      align-items:center;
      gap:10px;
    }
    .welcome-auto-bar .toggle-label{
      font-size:13px;
      font-weight:600;
    }
    .welcome-auto-bar .toggle-status{
      font-size:12px;
      opacity:.9;
    }
    .toggle-switch{
      position:relative;
      width:50px;
      height:26px;
      background:#fff;
      border-radius:13px;
      cursor:pointer;
      transition:.2s;
    }
    .toggle-switch::after{
      content:'';
      position:absolute;
      top:3px;
      left:3px;
      width:20px;
      height:20px;
      background:#ccc;
      border-radius:50%;
      transition:.2s;
    }
    .toggle-switch.on{
      background:#FFD700;
    }
    .toggle-switch.on::after{
      left:27px;
      background:#059669;
    }

    /* Time Column */
    .time-cell{
      background:#F8FAFC;
      font-weight:800;
      font-size:12px;
      color:#374151;
      display:flex;
      align-items:center;
      justify-content:center;
      border-right:2px solid var(--line) !important;
    }
    .time-cell.half{background:#F1F5F9}

    /* Empty Cell (clickable) */
    .empty-cell{
      cursor:pointer;
      transition:background .1s;
    }
    .empty-cell:hover{
      background:#EEF2FF;
    }
    .empty-cell.half{background:#FAFAFA}
    .empty-cell.half:hover{background:#EEF2FF}

    /* Reservation Cell */
    .res-cell{
      cursor:pointer;
    }
    .res-cell .res-content{
      padding:4px 6px;
      font-size:11px;
      line-height:1.3;
    }
    .res-cell .res-name{font-weight:800;font-size:12px}
    .res-cell .res-time{font-weight:700;opacity:.85}
    .res-cell .res-customer{font-weight:700;margin-top:1px}
    .res-cell .res-detail{color:var(--muted);margin-top:1px}
    .res-cell.continuation{
      /* Middle cells: just color, no text */
    }

    /* Drag & Drop */
    .res-cell.draggable{
      cursor:grab;
    }
    .res-cell.draggable:active{
      cursor:grabbing;
    }
    .res-cell.dragging{
      opacity:.5;
      outline:2px dashed var(--navy);
    }
    .grid-cell.drop-target{
      background:#DBEAFE !important;
      outline:2px solid #2563EB;
    }
    .grid-cell.drop-invalid{
      background:#FEE2E2 !important;
      outline:2px solid #DC2626;
    }
    .drag-ghost{
      position:fixed;
      pointer-events:none;
      z-index:1000;
      padding:8px 12px;
      background:var(--navy);
      color:#fff;
      border-radius:6px;
      font-size:12px;
      font-weight:700;
      box-shadow:0 8px 20px rgba(0,0,0,.3);
      white-space:nowrap;
    }

    /* Legend */
    .legend{
      display:flex;
      gap:8px;
      margin-top:12px;
      flex-wrap:wrap;
    }
    .legend-item{
      display:flex;
      align-items:center;
      gap:5px;
      font-size:12px;
      font-weight:700;
      background:#fff;
      border:1px solid var(--line);
      padding:4px 10px;
      border-radius:999px;
    }
    .legend-dot{
      width:12px;height:12px;border-radius:3px;
      border:1px solid rgba(0,0,0,.1);
    }

    /* Modal */
    .modal-overlay{
      position:fixed;
      inset:0;
      background:rgba(17,24,39,.5);
      display:none;
      align-items:center;
      justify-content:center;
      z-index:200;
      padding:16px;
    }
    .modal-overlay.show{display:flex}
    .modal{
      background:#fff;
      border-radius:12px;
      width:100%;
      max-width:420px;
      box-shadow:0 20px 50px rgba(0,0,0,.25);
      overflow:hidden;
    }
    .modal-header{
      background:linear-gradient(90deg, var(--navy), var(--navy2));
      color:#fff;
      padding:12px 16px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      font-weight:800;
    }
    .modal-close{
      background:transparent;
      border:1px solid rgba(255,255,255,.3);
      color:#fff;
      width:28px;height:28px;
      border-radius:6px;
      cursor:pointer;
      font-size:16px;
      display:flex;
      align-items:center;
      justify-content:center;
    }
    .modal-close:hover{background:rgba(255,255,255,.1)}
    .modal-body{
      padding:16px;
    }

    /* Form */
    .form-group{margin-bottom:12px}
    .form-label{
      font-size:12px;
      font-weight:800;
      color:var(--navy);
      margin-bottom:4px;
      display:block;
    }
    .form-input, .form-select, .form-textarea{
      width:100%;
      padding:10px 12px;
      border:1px solid var(--line);
      border-radius:8px;
      font-size:14px;
      background:#fff;
      outline:none;
      transition:border .15s;
    }
    .form-input:focus, .form-select:focus, .form-textarea:focus{
      border-color:var(--navy);
    }
    .form-textarea{min-height:80px;resize:vertical}
    .form-row{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:10px;
    }
    .form-hint{font-size:11px;color:var(--muted);margin-top:3px}
    .form-btn{
      width:100%;
      background:var(--navy);
      color:#fff;
      border:none;
      padding:12px;
      border-radius:8px;
      font-weight:800;
      font-size:14px;
      cursor:pointer;
      transition:.15s;
      margin-top:8px;
    }
    .form-btn:hover{filter:brightness(1.1)}
    .form-btn:disabled{opacity:.5;cursor:not-allowed}

    /* Detail Modal */
    .detail-grid{
      display:grid;
      grid-template-columns:100px 1fr;
      gap:8px;
      font-size:14px;
    }
    .detail-grid .label{color:var(--muted);font-weight:700}
    .detail-grid .value{font-weight:600}

    /* Detail Modal Buttons */
    .detail-actions{
      display:flex;
      gap:8px;
      margin-top:16px;
      padding-top:16px;
      border-top:1px solid var(--line);
    }
    .btn-edit{
      flex:1;
      background:var(--navy);
      color:#fff;
      border:none;
      padding:10px;
      border-radius:8px;
      font-weight:700;
      cursor:pointer;
      transition:.15s;
    }
    .btn-edit:hover{filter:brightness(1.1)}
    .btn-delete{
      background:#DC2626;
      color:#fff;
      border:none;
      padding:10px 16px;
      border-radius:8px;
      font-weight:700;
      cursor:pointer;
      transition:.15s;
    }
    .btn-delete:hover{background:#B91C1C}
    .btn-cancel{
      flex:1;
      background:#fff;
      color:var(--text);
      border:1px solid var(--line);
      padding:10px;
      border-radius:8px;
      font-weight:700;
      cursor:pointer;
    }
    .btn-cancel:hover{background:var(--bg)}
    .btn-save{
      flex:1;
      background:#059669;
      color:#fff;
      border:none;
      padding:10px;
      border-radius:8px;
      font-weight:700;
      cursor:pointer;
    }
    .btn-save:hover{background:#047857}
    .btn-save:disabled,.btn-delete:disabled{opacity:.5;cursor:not-allowed}

    /* Confirm Dialog */
    .confirm-overlay{
      position:fixed;
      inset:0;
      background:rgba(17,24,39,.6);
      display:none;
      align-items:center;
      justify-content:center;
      z-index:300;
    }
    .confirm-overlay.show{display:flex}
    .confirm-box{
      background:#fff;
      border-radius:12px;
      padding:20px;
      max-width:320px;
      text-align:center;
      box-shadow:0 20px 50px rgba(0,0,0,.3);
    }
    .confirm-box p{font-weight:700;margin-bottom:16px}
    .confirm-btns{display:flex;gap:10px}
    .confirm-btns button{flex:1;padding:10px;border-radius:8px;font-weight:700;cursor:pointer}
    .confirm-cancel{background:#fff;border:1px solid var(--line);color:var(--text)}
    .confirm-cancel:hover{background:var(--bg)}
    .confirm-ok{background:#DC2626;border:none;color:#fff}
    .confirm-ok:hover{background:#B91C1C}

    /* Toast */
    .toast{
      position:fixed;
      bottom:16px;
      right:16px;
      background:#111827;
      color:#fff;
      padding:10px 16px;
      border-radius:8px;
      font-weight:700;
      font-size:13px;
      box-shadow:0 10px 30px rgba(0,0,0,.2);
      display:none;
      z-index:300;
    }
    .toast.show{display:block}

    /* Save Status Indicator (A+C+B) */
    .save-status{
      display:inline-flex;
      align-items:center;
      gap:6px;
      padding:6px 12px;
      border-radius:6px;
      font-size:12px;
      font-weight:600;
      box-shadow:0 2px 8px rgba(0,0,0,.15);
      transition:all .2s;
    }
    .save-status.saved{
      background:#059669;
      color:#fff;
    }
    .save-status.saving{
      background:#F59E0B;
      color:#fff;
    }
    .save-status.unsaved{
      background:#DC2626;
      color:#fff;
    }
    .save-status.offline{
      background:#6B7280;
      color:#fff;
    }
    .save-status .spinner{
      width:14px;
      height:14px;
      border:2px solid rgba(255,255,255,.3);
      border-top-color:#fff;
      border-radius:50%;
      animation:spin .8s linear infinite;
    }
    @keyframes spin{
      to{transform:rotate(360deg)}
    }
    .save-status .retry-btn{
      background:rgba(255,255,255,.2);
      border:none;
      color:#fff;
      padding:2px 8px;
      border-radius:4px;
      cursor:pointer;
      font-size:11px;
      margin-left:4px;
    }
    .save-status .retry-btn:hover{background:rgba(255,255,255,.3)}

    /* Edit Toggle */
    .edit-toggle-bar{
      display:flex;
      align-items:center;
      margin-bottom:12px;
    }
    .edit-toggle{
      display:inline-flex;
      align-items:center;
      gap:10px;
      cursor:pointer;
      user-select:none;
      -webkit-user-select:none;
    }
    .edit-toggle input{display:none}
    .edit-toggle__slider{
      position:relative;
      width:44px;
      height:24px;
      background:#cbd5e0;
      border-radius:12px;
      transition:background .2s;
    }
    .edit-toggle__slider::after{
      content:'';
      position:absolute;
      top:2px;
      left:2px;
      width:20px;
      height:20px;
      background:#fff;
      border-radius:50%;
      transition:transform .2s;
      box-shadow:0 1px 3px rgba(0,0,0,.2);
    }
    .edit-toggle input:checked + .edit-toggle__slider{
      background:#2f9e44;
    }
    .edit-toggle input:checked + .edit-toggle__slider::after{
      transform:translateX(20px);
    }
    .edit-toggle__label{
      font-size:14px;
      font-weight:600;
      color:#4a5568;
    }
    /* Edit lock: disable grid interactions */
    .edit-locked .empty-cell{
      pointer-events:none;
      cursor:default;
    }
    .edit-locked .res-cell{
      pointer-events:none;
      cursor:default;
    }
    .edit-locked .empty-cell:hover{
      background:inherit;
    }

    /* Responsive */
    @media(max-width:768px){
      .week-tabs{gap:3px}
      .week-tab{min-width:auto;padding:5px 7px;font-size:11px}
      .week-tab .date{font-size:11px}
      .day-grid{grid-template-columns:60px repeat(var(--room-count), minmax(100px, 1fr))}
    }

    /* Welcome Board Styles - Morning Light Design */
    .welcome-overlay{
      position:fixed;
      inset:0;
      /* 朝〜昼の爽やかなブルーグラデーション */
      background:linear-gradient(160deg, #5B9BD5 0%, #3A7BD5 25%, #2563EB 50%, #1E40AF 100%);
      display:none;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      z-index:500;
      color:#fff;
      text-align:center;
      padding:40px;
      overflow:hidden;
    }
    .welcome-overlay.show{display:flex}
    /* 左上からの朝日の光 */
    .welcome-overlay::before{
      content:'';
      position:absolute;
      top:-30%;
      left:-20%;
      width:80%;
      height:80%;
      background:radial-gradient(ellipse at center, rgba(255,255,255,.35) 0%, rgba(255,255,255,.15) 30%, transparent 70%);
      pointer-events:none;
      animation:sunGlow 8s ease-in-out infinite alternate;
    }
    @keyframes sunGlow{
      0%{opacity:.8;transform:scale(1)}
      100%{opacity:1;transform:scale(1.1)}
    }
    /* 右下にも柔らかい光 */
    .welcome-overlay::after{
      content:'';
      position:absolute;
      bottom:-20%;
      right:-10%;
      width:60%;
      height:60%;
      background:radial-gradient(ellipse at center, rgba(255,255,255,.1) 0%, transparent 60%);
      pointer-events:none;
    }
    .welcome-sparkles{
      position:absolute;
      inset:0;
      pointer-events:none;
      overflow:hidden;
    }
    /* 光の粒子（星→朝の光の粒） */
    .sparkle{
      position:absolute;
      width:6px;height:6px;
      background:rgba(255,255,255,.9);
      border-radius:50%;
      box-shadow:0 0 8px rgba(255,255,255,.8), 0 0 15px rgba(255,255,255,.4);
      animation:floatUp 6s ease-in-out infinite;
    }
    @keyframes floatUp{
      0%{opacity:0;transform:translateY(20px) scale(.5)}
      20%{opacity:1}
      80%{opacity:1}
      100%{opacity:0;transform:translateY(-100px) scale(.8)}
    }
    .welcome-close{
      position:absolute;
      top:20px;
      right:20px;
      background:rgba(255,255,255,.2);
      border:1px solid rgba(255,255,255,.4);
      color:#fff;
      width:50px;
      height:50px;
      border-radius:12px;
      font-size:24px;
      cursor:pointer;
      display:flex;
      align-items:center;
      justify-content:center;
      transition:.2s;
      z-index:10;
    }
    .welcome-close:hover{background:rgba(255,255,255,.3)}
    .welcome-content{
      position:relative;
      z-index:5;
      animation:fadeInUp .8s ease-out;
    }
    @keyframes fadeInUp{
      from{opacity:0;transform:translateY(30px)}
      to{opacity:1;transform:translateY(0)}
    }

<script>
// =========================
// State
// =========================
const state = {
  masters: { names: [], rooms: [], slots: [] },
  window: { today: '', from: '', to: '' },
  selectedDate: '',
  weekDays: [],
  reservationsByDate: {},
  roomColors: {},
  weekCounts: {}, // date -> total count
  editingReservation: null, // 現在編集中の予約
  isEditMode: false, // 編集モードかどうか
  // Welcome Auto Display
  welcomeSelectedRoom: null, // 選択中の会議室
  welcomeAutoEnabled: false, // 自動表示ON/OFF
  welcomeAutoInterval: null, // ポーリング用インターバル
  welcomeCurrentReservation: null, // 現在表示中の予約
  // Drag & Drop
  dragging: null, // ドラッグ中の予約情報 { reservation, startCell, duration }
  dragGhost: null // ドラッグゴースト要素
};

// =========================
// SyncManager (A+C+B方式)
// =========================
const SyncManager = {
  STORAGE_KEY: 'calendar_sync',
  DEBOUNCE_MS: 3000,        // 無操作3秒で自動保存
  RETRY_INTERVAL_MS: 30000, // 30秒ごとにリトライ

  // 状態
  queue: [],           // C: 変更キュー
  drafts: {},          // A: ローカルドラフト
  inflight: false,     // 送信中フラグ
  debounceTimer: null, // デバウンスタイマー
  retryTimer: null,    // リトライタイマー
  isOnline: navigator.onLine,

  // 初期化
  init() {
    this.loadFromStorage();
    this.updateStatusUI('saved');

    // オンライン/オフライン監視
    window.addEventListener('online', () => {
      this.isOnline = true;
      this.flush();
    });
    window.addEventListener('offline', () => {
      this.isOnline = false;
      this.updateStatusUI('offline');
    });

    // ページ離脱前に保存試行
    window.addEventListener('beforeunload', (e) => {
      this.saveToStorage();
      if (this.queue.length > 0) {
        e.preventDefault();
        e.returnValue = '未保存のデータがあります';
      }
    });

    // 起動時に未送信キューがあれば送信
    if (this.queue.length > 0) {
      this.updateStatusUI('unsaved');
      setTimeout(() => this.flush(), 1000);
    }

    // 定期リトライ開始
    this.startRetryTimer();
  },

  // ストレージ読み込み
  loadFromStorage() {
    try {
      const data = localStorage.getItem(this.STORAGE_KEY);
      if (data) {
        const parsed = JSON.parse(data);
        this.queue = parsed.queue || [];
        this.drafts = parsed.drafts || {};
      }
    } catch (e) {
      console.error('SyncManager loadFromStorage error:', e);
    }
  },

  // ストレージ保存
  saveToStorage() {
    try {
      localStorage.setItem(this.STORAGE_KEY, JSON.stringify({
        queue: this.queue,
        drafts: this.drafts
      }));
    } catch (e) {
      console.error('SyncManager saveToStorage error:', e);
    }
  },

  // ドラフト保存（A）
  saveDraft(recordId, data) {
    this.drafts[recordId] = {
      ...data,
      _savedAt: Date.now()
    };
    this.saveToStorage();
  },

  // ドラフト取得
  getDraft(recordId) {
    return this.drafts[recordId] || null;
  },

  // ドラフト削除
  clearDraft(recordId) {
    delete this.drafts[recordId];
    this.saveToStorage();
  },

  // 変更をキューに追加（C）
  enqueue(recordId, patch, revision = null) {
    // 同じrecordIdの古いエントリを削除してマージ
    const existingIdx = this.queue.findIndex(q => q.recordId === recordId);
    if (existingIdx >= 0) {
      const existing = this.queue[existingIdx];
      this.queue[existingIdx] = {
        recordId,
        patch: { ...existing.patch, ...patch },
        revision: revision || existing.revision,
        queuedAt: Date.now()
      };
    } else {
      this.queue.push({
        recordId,
        patch,
        revision,
        queuedAt: Date.now()
      });
    }

    this.saveToStorage();
    this.updateStatusUI('unsaved');
    this.scheduleFlush();
  },

  // デバウンス付きフラッシュスケジュール
  scheduleFlush() {
    if (this.debounceTimer) {
      clearTimeout(this.debounceTimer);
    }
    this.debounceTimer = setTimeout(() => {
      this.flush();
    }, this.DEBOUNCE_MS);
  },

  // キューをサーバーに送信（B）
  // while ループで再帰呼び出しを排除し、inflight フラグのレース条件を防止
  async flush() {
    if (this.inflight || this.queue.length === 0) return;
    if (!this.isOnline) {
      this.updateStatusUI('offline');
      return;
    }

    this.inflight = true;
    this.updateStatusUI('saving');

    let lastTouchedDate = null;
    let networkErrored = false;
    let anyLogicError = false;

    try {
      while (this.queue.length > 0) {
        const item = this.queue[0];
        let result;
        try {
          result = await this.sendToServer(item.recordId, item.patch, item.revision);
        } catch (e) {
          // ネットワーク/トランスポートエラー：キューに残してリトライ
          console.error('Sync error:', e);
          toast('通信エラー。自動で再試行します。');
          networkErrored = true;
          break;
        }

        if (result.ok) {
          this.queue.shift();
          if (result.oldTempId && result.recordId !== result.oldTempId) {
            this.replaceTempId(result.oldTempId, result.recordId);
          }
          this.clearDraft(item.recordId);
          this.saveToStorage();
          lastTouchedDate = item.patch && item.patch.date;
        } else {
          // 論理エラー（CONFLICT/STALE/NOT_FOUND/ERROR）：shiftして次へ進む
          console.error('Sync failed:', result);
          toast('⚠ ' + (result.message || '保存に失敗しました'));
          anyLogicError = true;
          lastTouchedDate = item.patch && item.patch.date;
          this.queue.shift();
          this.clearDraft(item.recordId);
          this.saveToStorage();
        }
      }

      if (networkErrored) {
        this.updateStatusUI('unsaved');
      } else {
        this.updateStatusUI('saved');
        if (!anyLogicError) toast('保存しました');
        if (lastTouchedDate) await this.refreshAfterSync(lastTouchedDate);
      }
    } finally {
      this.inflight = false;
    }
  },

  // サーバー送信
  sendToServer(recordId, patch, revision) {
    return new Promise((resolve, reject) => {
      google.script.run
        .withSuccessHandler(resolve)
        .withFailureHandler(reject)
        .applyPatch(recordId, patch, revision);
    });
  },

  // 仮IDを正式IDに置換
  replaceTempId(oldId, newId) {
    // ドラフト置換
    if (this.drafts[oldId]) {
      this.drafts[newId] = this.drafts[oldId];
      delete this.drafts[oldId];
    }

    // キュー内の置換
    this.queue.forEach(q => {
      if (q.recordId === oldId) {
        q.recordId = newId;
      }
    });

    // state内のキャッシュも更新
    Object.values(state.reservationsByDate).forEach(list => {
      list.forEach(r => {
        if (r.reservationId === oldId) {
          r.reservationId = newId;
        }
      });
    });
  },

  // 同期後のリフレッシュ
  async refreshAfterSync(date) {
    if (date) {
      delete state.reservationsByDate[date];
    }
    await loadWeekData();
    await loadDayAndRender(state.selectedDate);
  },

  // リトライタイマー開始
  startRetryTimer() {
    if (this.retryTimer) clearInterval(this.retryTimer);
    this.retryTimer = setInterval(() => {
      if (this.queue.length > 0 && !this.inflight) {
        this.flush();
      }
    }, this.RETRY_INTERVAL_MS);
  },

  // UI更新
  updateStatusUI(status) {
    const el = document.getElementById('saveStatus');
    if (!el) return;

    el.className = 'save-status ' + status;

    const iconEl = el.querySelector('.status-icon');
    const textEl = el.querySelector('.status-text');

    // 既存のリトライボタンを削除
    const existingBtn = el.querySelector('.retry-btn');
    if (existingBtn) existingBtn.remove();

    switch (status) {
      case 'saved':
        iconEl.innerHTML = '✓';
        textEl.textContent = '保存済み';
        break;
      case 'saving':
        iconEl.innerHTML = '<div class="spinner"></div>';
        textEl.textContent = '保存中...';
        break;
      case 'unsaved':
        iconEl.innerHTML = '!';
        textEl.textContent = `未保存 (${this.queue.length}件)`;
        const btn = document.createElement('button');
        btn.className = 'retry-btn';
        btn.textContent = '再試行';
        btn.onclick = () => this.flush();
        el.appendChild(btn);
        break;
      case 'offline':
        iconEl.innerHTML = '⚡';
        textEl.textContent = 'オフライン';
        break;
    }
  },

  // 仮ID生成
  generateTempId() {
    return 'tmp-' + crypto.randomUUID();
  }
};

// =========================
// Utils
// =========================
function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

function ymd(d) {
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, '0');
  const day = String(d.getDate()).padStart(2, '0');
  return `${y}-${m}-${day}`;
}

function addDays(dateStr, n) {
  const d = new Date(dateStr + 'T00:00:00');
  d.setDate(d.getDate() + n);
  return ymd(d);
}

function getDayOfWeek(dateStr) {
  const days = ['日', '月', '火', '水', '木', '金', '土'];
  const d = new Date(dateStr + 'T00:00:00');
  return days[d.getDay()];
}

function formatDateShort(dateStr) {
  const parts = dateStr.split('-');
  return `${parseInt(parts[1])}/${parseInt(parts[2])}`;
}

function clampWindow(dateStr) {
  if (dateStr < state.window.from) return state.window.from;
  if (dateStr > state.window.to) return state.window.to;
  return dateStr;
}

function escapeHtml(s) {
  return String(s ?? '')
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

function summarize(text, max = 20) {
  const t = (text || '').trim();
  if (!t) return '';
  return t.length > max ? t.slice(0, max) + '...' : t;
}

// =========================
// GAS Calls
// =========================
function gasGetMasters() {
  return new Promise((res, rej) => {
    google.script.run.withSuccessHandler(res).withFailureHandler(rej).getMasters();
  });
}

function gasGetWindow() {
  return new Promise((res, rej) => {
    google.script.run.withSuccessHandler(res).withFailureHandler(rej).getWindowBase();
  });
}

function gasListReservations(from, to, room) {
  return new Promise((res, rej) => {
    google.script.run.withSuccessHandler(res).withFailureHandler(rej).listReservations(from, to, room || '');
  });
}

function gasCreateReservation(payload) {
  return new Promise((res, rej) => {
    google.script.run.withSuccessHandler(res).withFailureHandler(rej).createReservation(payload);
  });
}

function gasUpdateReservation(reservationId, payload) {
  return new Promise((res, rej) => {
    google.script.run.withSuccessHandler(res).withFailureHandler(rej).updateReservation(reservationId, payload);
  });
}

function gasDeleteReservation(reservationId) {
  return new Promise((res, rej) => {
    google.script.run.withSuccessHandler(res).withFailureHandler(rej).deleteReservation(reservationId);
  });
}

// =========================
// Initialization
// =========================
async function init() {
  try {
    // SyncManager初期化（A+C+B方式）
    SyncManager.init();

    const [masters, win] = await Promise.all([gasGetMasters(), gasGetWindow()]);
    state.masters = masters;
    state.window = win;
    state.selectedDate = win.today;

    // Room colors
    const palette = ['#FDE68A', '#BBF7D0', '#BFDBFE', '#FBCFE8', '#DDD6FE', '#FED7AA'];
    state.masters.rooms.forEach((r, i) => {
      state.roomColors[r] = palette[i % palette.length];
    });

    // Build week days (7 days from today)
    // サーバ window から動的に算出（WINDOW_DAYS 変更時に追従）
    state.weekDays = [];
    let cursor = win.from;
    while (cursor <= win.to) {
      state.weekDays.push(cursor);
      cursor = addDays(cursor, 1);
    }

    initEditToggle();
    buildFormOptions();
    buildLegend();

    // Load week data for counts
    await loadWeekData();

    // Initial render
    await loadDayAndRender(state.selectedDate);

    // Welcome Auto状態を復元
    loadWelcomeAutoState();

    toast('初期化完了');
  } catch (e) {
    console.error(e);
    toast('初期化エラー: ' + (e.message || e));
  }
}

// =========================
// Week Data & Tabs
// =========================
async function loadWeekData() {
  const from = state.weekDays[0];
  const to = state.weekDays[state.weekDays.length - 1];
  const all = await gasListReservations(from, to, '');

  // Count per date
  state.weekCounts = {};
  state.weekDays.forEach(d => state.weekCounts[d] = 0);
  all.forEach(r => {
    if (state.weekCounts[r.date] !== undefined) {
      state.weekCounts[r.date]++;
    }
    // Cache reservations
    if (!state.reservationsByDate[r.date]) state.reservationsByDate[r.date] = [];
    const exists = state.reservationsByDate[r.date].find(x => x.reservationId === r.reservationId);
    if (!exists) state.reservationsByDate[r.date].push(r);
  });

  renderWeekTabs();
}

function renderWeekTabs() {
  const container = document.getElementById('weekTabs');
  container.innerHTML = '';

  state.weekDays.forEach(d => {
    const tab = document.createElement('div');
    tab.className = 'week-tab' + (d === state.selectedDate ? ' active' : '');
    tab.onclick = () => selectDate(d);

    const dateLabel = formatDateShort(d) + '(' + getDayOfWeek(d) + ')';
    const count = state.weekCounts[d] || 0;

    tab.innerHTML = `
      <div class="date">${dateLabel}</div>
      <div class="count">${count}件</div>
    `;
    container.appendChild(tab);
  });
}

function selectDate(dateStr) {
  state.selectedDate = clampWindow(dateStr);
  loadDayAndRender(state.selectedDate);
  renderWeekTabs();
}

// モーダル用：7日タブの日付ピッカーを描画
function buildDateTabs(containerId, hiddenId, selectedDate) {
  const container = document.getElementById(containerId);
  const hidden = document.getElementById(hiddenId);
  if (!container || !hidden) return;
  container.innerHTML = '';

  const days = state.weekDays.slice();
  // 編集中の予約が予約可能期間外の場合、強制的にタブに含める
  if (selectedDate && !days.includes(selectedDate)) {
    days.unshift(selectedDate);
  }

  days.forEach(d => {
    const tab = document.createElement('button');
    tab.type = 'button';
    tab.className = 'date-tab' + (d === selectedDate ? ' active' : '');
    if (!state.weekDays.includes(d)) tab.classList.add('out-of-range');

    const parts = d.split('-');
    const mm = parts[1];
    const dd = parts[2];
    tab.innerHTML = `
      <div class="date-num">${mm}/${dd}</div>
      <div class="date-dow">${getDayOfWeek(d)}</div>
    `;
    tab.onclick = () => {
      hidden.value = d;
      container.querySelectorAll('.date-tab').forEach(t => t.classList.remove('active'));
      tab.classList.add('active');
    };
    container.appendChild(tab);
  });

  hidden.value = selectedDate || (days[0] || '');
}

// Day Loading & Rendering
// =========================
async function loadDayAndRender(dateStr) {
  state.selectedDate = dateStr;

  // 編集トグルをOFFにリセット
  resetEditToggle();

  // Check cache or fetch
  if (!state.reservationsByDate[dateStr]) {
    const list = await gasListReservations(dateStr, dateStr, '');
    state.reservationsByDate[dateStr] = list;
  }

  renderDayTitle();
  renderDayGrid();
}

function renderDayTitle() {
  const d = state.selectedDate;
  const dow = getDayOfWeek(d);
  document.getElementById('dayTitle').textContent = `${d} (${dow})`;
}

function renderDayGrid() {
  const grid = document.getElementById('dayGrid');
  const rooms = state.masters.rooms;
  const slots = state.masters.slots;
  const reservations = state.reservationsByDate[state.selectedDate] || [];

  // Set CSS variable for room count
  grid.style.setProperty('--room-count', rooms.length);

  // Build time index map: "09:00" -> 0, "09:30" -> 1, etc.
  const timeIndex = {};
  slots.forEach((s, i) => timeIndex[s.start] = i);

  // Build reservation map: room -> array of {startIdx, endIdx, reservation}
  const resMap = {};
  rooms.forEach(r => resMap[r] = []);

  reservations.forEach(r => {
    const startIdx = timeIndex[r.startTime];
    const endIdx = timeIndex[r.endTime];
    if (startIdx === undefined) return;
    const actualEnd = endIdx !== undefined ? endIdx : slots.length;
    resMap[r.room]?.push({
      startIdx,
      endIdx: actualEnd,
      res: r
    });
  });

  // Clear and rebuild grid
  grid.innerHTML = '';

  // Header row
  const headerRow = document.createElement('div');
  headerRow.className = 'grid-row';
  headerRow.style.display = 'contents';

  const timeHeader = document.createElement('div');
  timeHeader.className = 'grid-cell grid-header';
  timeHeader.textContent = 'Time';
  headerRow.appendChild(timeHeader);

  rooms.forEach(room => {
    const roomHeader = document.createElement('div');
    roomHeader.className = 'grid-cell grid-header room-header';
    if (state.welcomeSelectedRoom === room) {
      roomHeader.classList.add('selected');
    }
    const roomColor = state.roomColors[room] || '#E5E7EB';
    roomHeader.style.setProperty('--room-color', roomColor);
    roomHeader.textContent = room;
    roomHeader.onclick = () => selectRoomForWelcome(room);
    headerRow.appendChild(roomHeader);
  });
  grid.appendChild(headerRow);

  // Time rows
  slots.forEach((slot, rowIdx) => {
    const row = document.createElement('div');
    row.className = 'grid-row';
    row.style.display = 'contents';

    // Time cell
    const timeCell = document.createElement('div');
    timeCell.className = 'grid-cell time-cell' + (rowIdx % 2 === 1 ? ' half' : '');
    timeCell.textContent = slot.start;
    row.appendChild(timeCell);

    // Room cells
    rooms.forEach(room => {
      const cell = document.createElement('div');
      cell.className = 'grid-cell room-col';
      cell.dataset.room = room;
      cell.dataset.time = slot.start;
      cell.dataset.rowIdx = rowIdx;

      // Apply room color as CSS variable for column border
      const roomColor = state.roomColors[room] || '#E5E7EB';
      cell.style.setProperty('--room-color', roomColor);

      // Check if this cell has a reservation
      const resInfo = resMap[room]?.find(ri => rowIdx >= ri.startIdx && rowIdx < ri.endIdx);

      if (resInfo) {
        const color = roomColor;
        cell.style.background = color;
        cell.className += ' res-cell';

        if (rowIdx === resInfo.startIdx) {
          // Start cell: show content (draggable)
          const r = resInfo.res;
          const duration = resInfo.endIdx - resInfo.startIdx; // スロット数
          cell.classList.add('draggable');
          cell.dataset.reservationId = r.reservationId;
          cell.dataset.duration = duration;
          cell.innerHTML = `
            <div class="res-content">
              <div class="res-name">${escapeHtml(r.name)}</div>
              <div class="res-time">${escapeHtml(r.startTime)}-${escapeHtml(r.endTime)}</div>
              ${r.customerName ? `<div class="res-customer">${escapeHtml(summarize(r.customerName, 15))}</div>` : ''}
              ${r.meetingDetail ? `<div class="res-detail">${escapeHtml(summarize(r.meetingDetail, 20))}</div>` : ''}
            </div>
          `;
          // ドラッグ開始
          cell.onpointerdown = (e) => startDrag(e, r, cell, duration);
          // クリック（ドラッグしなかった場合）
          cell.onclick = (e) => {
            if (!state.dragging) showDetailModal(r);
          };
        } else {
          // Continuation cell: just color
          cell.className += ' continuation';
          cell.onclick = () => showDetailModal(resInfo.res);
        }
      } else {
        // Empty cell - apply very light room color tint
        cell.className += ' empty-cell' + (rowIdx % 2 === 1 ? ' half' : '');
        cell.style.background = roomColor + '18'; // ~10% opacity hex
        cell.onclick = () => openFormModal(room, slot.start);
      }

      row.appendChild(cell);
    });

    grid.appendChild(row);
  });
}

// 作業員マスタ取得（外部シート取得失敗時は内部Masterのnamesにフォールバック）
function getWorkerList() {
  const workers = state.masters.workers || [];
  if (workers.length > 0) return workers.slice();
  return (state.masters.names || []).map(name => ({ name, department: '' }));
}

// 同姓同名がある場合のみ「氏名 (部署)」で区別表示
function workerDisplayLabel(worker, workerList) {
  const dup = workerList.filter(w => w.name === worker.name).length > 1;
  if (dup && worker.department) {
    return worker.name + ' (' + worker.department + ')';
  }
  return worker.name;
}

function buildFormOptions() {
  // Departments (作業員マスタから生成)
  const deptSel = document.getElementById('fDept');
  deptSel.innerHTML = '';
  const allOpt = document.createElement('option');
  allOpt.value = '';
  allOpt.textContent = '全て';
  deptSel.appendChild(allOpt);

  const workerList = getWorkerList();
  const depts = [...new Set(workerList.map(w => w.department).filter(d => d))].sort();
  depts.forEach(d => {
    const opt = document.createElement('option');
    opt.value = d;
    opt.textContent = d;
    deptSel.appendChild(opt);
  });

  // Names（部署フィルタ初期化、デフォルトは「全て」）
  filterFNameByDept();

  // Rooms
  const roomSel = document.getElementById('fRoom');
  roomSel.innerHTML = '';
  state.masters.rooms.forEach(r => {
    const opt = document.createElement('option');
    opt.value = r;
    opt.textContent = r;
    roomSel.appendChild(opt);
  });

  // Times
  const startSel = document.getElementById('fStart');
  const endSel = document.getElementById('fEnd');
  startSel.innerHTML = '';
  endSel.innerHTML = '';

  state.masters.slots.forEach(s => {
    const optS = document.createElement('option');
    optS.value = s.start;
    optS.textContent = s.start;
    startSel.appendChild(optS);

    const optE = document.createElement('option');
    optE.value = s.end;
    optE.textContent = s.end;
    endSel.appendChild(optE);
  });
}

function filterFNameByDept() {
  const dept = document.getElementById('fDept').value;
  const nameSel = document.getElementById('fName');
  const prevValue = nameSel.value;
  nameSel.innerHTML = '';

  const workerList = getWorkerList();
  const filtered = dept ? workerList.filter(w => w.department === dept) : workerList;

  filtered.forEach(w => {
    const opt = document.createElement('option');
    opt.value = w.name;
    opt.textContent = workerDisplayLabel(w, filtered);
    nameSel.appendChild(opt);
  });

  // 前の選択を保持（フィルタ後にも存在する場合）
  if (prevValue && filtered.some(w => w.name === prevValue)) {
    nameSel.value = prevValue;
  }
}

function filterEditNameByDept() {
  const dept = document.getElementById('editDept').value;
  const nameSel = document.getElementById('editName');
  const prevValue = nameSel.value;
  nameSel.innerHTML = '';

  const workerList = getWorkerList();
  const currentName = state.editingReservation ? state.editingReservation.name : '';

  // マスタから消えた既存予約作業者をフォールバックエントリとして追加
  let extended = workerList;
  if (currentName && !workerList.some(w => w.name === currentName)) {
    extended = workerList.concat([{ name: currentName, department: '' }]);
  }

  const filtered = dept ? extended.filter(w => w.department === dept) : extended;

  filtered.forEach(w => {
    const opt = document.createElement('option');
    opt.value = w.name;
    opt.textContent = workerDisplayLabel(w, filtered);
    nameSel.appendChild(opt);
  });

  if (prevValue && filtered.some(w => w.name === prevValue)) {
    nameSel.value = prevValue;
  } else if (currentName && filtered.some(w => w.name === currentName)) {
    nameSel.value = currentName;
  }
}

function openFormModal(room, startTime) {
  buildDateTabs('fDateTabs', 'fDate', state.selectedDate);
  document.getElementById('fRoom').value = room;
  document.getElementById('fStart').value = startTime;

  // End = start + 1時間（2スロット先）、ただし業務終了時刻を超えない
  const idx = state.masters.slots.findIndex(s => s.start === startTime);
  if (idx >= 0) {
    // +1時間 = 2スロット先の終了時刻
    const endIdx = Math.min(idx + 2, state.masters.slots.length) - 1;
    document.getElementById('fEnd').value = state.masters.slots[endIdx].end;
  }

  document.getElementById('fCustomer').value = '';
  document.getElementById('fDetail').value = '';
  document.getElementById('formHint').textContent = '';

  document.getElementById('formModal').classList.add('show');
}

function closeFormModal() {
  document.getElementById('formModal').classList.remove('show');
}

async function submitReservation() {
  const btn = document.getElementById('btnSubmit');
  const hint = document.getElementById('formHint');
  hint.textContent = '';

  const payload = {
    date: document.getElementById('fDate').value,
    startTime: document.getElementById('fStart').value,
    endTime: document.getElementById('fEnd').value,
    room: document.getElementById('fRoom').value,
    name: document.getElementById('fName').value,
    customerName: document.getElementById('fCustomer').value,
    meetingDetail: document.getElementById('fDetail').value
  };

  // バリデーション
  if (!payload.date || !payload.startTime || !payload.endTime || !payload.room || !payload.name || !(payload.customerName || '').trim()) {
    hint.textContent = '必須項目を入力してください';
    return;
  }

  // 期間チェック（送信前に弾く：サーバ往復のロスを防ぐ）
  if (state.window && (payload.date < state.window.from || payload.date > state.window.to)) {
    hint.textContent = `予約可能期間外です（${state.window.from} 〜 ${state.window.to}）`;
    return;
  }

  // A+C+B方式: 仮ID生成してローカル保存 → キューに追加 → UI即時閉じる
  const tempId = SyncManager.generateTempId();

  // A: ローカルドラフト保存
  SyncManager.saveDraft(tempId, payload);

  // C: キューに追加（3秒後に自動送信）
  SyncManager.enqueue(tempId, payload);

  // UIは即座に閉じる（入力を止めない）
  closeFormModal();
  toast('予約を登録中...');

  // ローカルキャッシュに仮追加（即時反映）
  const tempReservation = {
    reservationId: tempId,
    ...payload,
    status: 'active'
  };

  if (!state.reservationsByDate[payload.date]) {
    state.reservationsByDate[payload.date] = [];
  }
  state.reservationsByDate[payload.date].push(tempReservation);

  // Update week counts
  if (state.weekCounts[payload.date] !== undefined) {
    state.weekCounts[payload.date]++;
    renderWeekTabs();
  }

  // グリッド再描画（仮データで即時表示）
  renderDayGrid();
}

async function submitUpdate() {
  const r = state.editingReservation;
  if (!r) return;

  const btn = document.getElementById('btnSave');
  const hint = document.getElementById('editHint');
  hint.textContent = '';

  const payload = {
    date: document.getElementById('editDate').value,
    startTime: document.getElementById('editStart').value,
    endTime: document.getElementById('editEnd').value,
    room: document.getElementById('editRoom').value,
    name: document.getElementById('editName').value,
    customerName: document.getElementById('editCustomer').value,
    meetingDetail: document.getElementById('editDetail').value
  };

  // バリデーション
  if (!payload.date || !payload.startTime || !payload.endTime || !payload.room || !payload.name || !(payload.customerName || '').trim()) {
    hint.textContent = '必須項目を入力してください';
    return;
  }

  // 期間チェック（送信前に弾く：サーバ往復のロスを防ぐ）
  if (state.window && (payload.date < state.window.from || payload.date > state.window.to)) {
    hint.textContent = `予約可能期間外です（${state.window.from} 〜 ${state.window.to}）`;
    return;
  }

  // A+C+B方式: ローカル更新 → キューに追加 → UI即時閉じる
  const recordId = r.reservationId;
  const oldDate = r.date;

  // A: ローカルドラフト保存
  SyncManager.saveDraft(recordId, payload);

  // C: キューに追加（3秒後に自動送信）
  SyncManager.enqueue(recordId, payload, Date.now());

  // UIは即座に閉じる
  closeDetailModal();
  toast('予約を更新中...');

  // ローカルキャッシュを即時更新
  const listOld = state.reservationsByDate[oldDate];
  if (listOld) {
    const idx = listOld.findIndex(x => x.reservationId === recordId);
    if (idx >= 0) {
      // 日付が変わった場合は古いリストから削除
      if (oldDate !== payload.date) {
        listOld.splice(idx, 1);
        // 新しい日付のリストに追加
        if (!state.reservationsByDate[payload.date]) {
          state.reservationsByDate[payload.date] = [];
        }
        state.reservationsByDate[payload.date].push({
          reservationId: recordId,
          ...payload,
          status: 'active'
        });
        // カウント更新
        if (state.weekCounts[oldDate] !== undefined && state.weekCounts[oldDate] > 0) {
          state.weekCounts[oldDate]--;
        }
        if (state.weekCounts[payload.date] !== undefined) {
          state.weekCounts[payload.date]++;
        }
      } else {
        // 同じ日付なら上書き
        listOld[idx] = {
          reservationId: recordId,
          ...payload,
          status: 'active'
        };
      }
    }
  }

  renderWeekTabs();
  renderDayGrid();
}

function confirmDelete() {
  document.getElementById('confirmDialog').classList.add('show');
}

function closeConfirmDialog() {
  document.getElementById('confirmDialog').classList.remove('show');
}

async function executeDelete() {
  const r = state.editingReservation;
  if (!r) return;

  const btn = document.getElementById('confirmDeleteBtn');
  btn.disabled = true;
  btn.textContent = '削除中...';

  try {
    const res = await gasDeleteReservation(r.reservationId);
    if (!res.ok) {
      toast(res.message || '削除に失敗しました');
      return;
    }

    toast('予約を削除しました');
    closeConfirmDialog();
    closeDetailModal();

    // キャッシュクリアして再読み込み
    delete state.reservationsByDate[r.date];

    // 週カウントも更新
    if (state.weekCounts[r.date] !== undefined && state.weekCounts[r.date] > 0) {
      state.weekCounts[r.date]--;
      renderWeekTabs();
    }

    await loadDayAndRender(state.selectedDate);
  } catch (e) {
    console.error(e);
    toast('エラー: ' + (e.message || e));
  } finally {
    btn.disabled = false;
    btn.textContent = '削除する';
  }
}

function closeDetailModal() {
  document.getElementById('detailModal').classList.remove('show');
  state.editingReservation = null;
  state.isEditMode = false;
}

function buildLegend() {
  const container = document.getElementById('legend');
  container.innerHTML = '';
  state.masters.rooms.forEach(room => {
    const color = state.roomColors[room];
    const item = document.createElement('div');
    item.className = 'legend-item';
    item.style.borderColor = color;
    item.style.borderWidth = '2px';
    item.innerHTML = `<span class="legend-dot" style="background:${color}"></span>${escapeHtml(room)}`;
    container.appendChild(item);
  });
}

// =========================
// Navigation
// =========================
function shiftDay(delta) {
  const next = clampWindow(addDays(state.selectedDate, delta));
  selectDate(next);
}

function goToday() {
  selectDate(state.window.today);
}

// =========================
// Drag & Drop
// =========================
let dragStartPos = null;
let dragMoved = false;

function startDrag(e, reservation, cell, duration) {
  // 左クリックのみ
  if (e.button !== 0) return;

  e.preventDefault();
  dragStartPos = { x: e.clientX, y: e.clientY };
  dragMoved = false;

  const onMove = (moveE) => {
    const dx = Math.abs(moveE.clientX - dragStartPos.x);
    const dy = Math.abs(moveE.clientY - dragStartPos.y);

    // 5px以上動いたらドラッグ開始
    if (!dragMoved && (dx > 5 || dy > 5)) {
      dragMoved = true;
      state.dragging = { reservation, startCell: cell, duration };
      cell.classList.add('dragging');
      createDragGhost(reservation, moveE);
    }

    if (dragMoved) {
      updateDragGhost(moveE);
      highlightDropTarget(moveE);
    }
  };

  const onUp = async (upE) => {
    document.removeEventListener('pointermove', onMove);
    document.removeEventListener('pointerup', onUp);

    if (dragMoved && state.dragging) {
      cell.classList.remove('dragging');
      removeDragGhost();
      clearDropHighlights();

      const target = getDropTarget(upE);
      if (target && target.room && target.time) {
        await moveReservation(state.dragging.reservation, target.room, target.time, state.dragging.duration);
      }

      state.dragging = null;
    }

    dragMoved = false;
    dragStartPos = null;
  };

  document.addEventListener('pointermove', onMove);
  document.addEventListener('pointerup', onUp);
}

function createDragGhost(reservation, e) {
  const ghost = document.createElement('div');
  ghost.className = 'drag-ghost';
  ghost.textContent = `${reservation.name} (${reservation.startTime}-${reservation.endTime})`;
  ghost.style.left = e.clientX + 10 + 'px';
  ghost.style.top = e.clientY + 10 + 'px';
  document.body.appendChild(ghost);
  state.dragGhost = ghost;
}

function updateDragGhost(e) {
  if (state.dragGhost) {
    state.dragGhost.style.left = e.clientX + 10 + 'px';
    state.dragGhost.style.top = e.clientY + 10 + 'px';
  }
}

function removeDragGhost() {
  if (state.dragGhost) {
    state.dragGhost.remove();
    state.dragGhost = null;
  }
}

function getDropTarget(e) {
  const el = document.elementFromPoint(e.clientX, e.clientY);
  if (!el) return null;

  const cell = el.closest('.grid-cell');
  if (!cell || !cell.dataset.room || !cell.dataset.time) return null;

  return {
    room: cell.dataset.room,
    time: cell.dataset.time,
    rowIdx: parseInt(cell.dataset.rowIdx, 10)
  };
}

function highlightDropTarget(e) {
  clearDropHighlights();

  const target = getDropTarget(e);
  if (!target || !state.dragging) return;

  const { duration, reservation } = state.dragging;
  const startIdx = parseInt(target.rowIdx, 10);
  const endIdx = startIdx + duration;

  // ドロップ可能かチェック
  const canDrop = checkCanDrop(target.room, startIdx, endIdx, reservation.reservationId);

  // ハイライト
  const cells = document.querySelectorAll(`.grid-cell[data-room="${target.room}"]`);
  cells.forEach(cell => {
    const idx = parseInt(cell.dataset.rowIdx, 10);
    if (idx >= startIdx && idx < endIdx) {
      cell.classList.add(canDrop ? 'drop-target' : 'drop-invalid');
    }
  });
}

function clearDropHighlights() {
  document.querySelectorAll('.drop-target, .drop-invalid').forEach(el => {
    el.classList.remove('drop-target', 'drop-invalid');
  });
}

function checkCanDrop(room, startIdx, endIdx, excludeId) {
  const slots = state.masters.slots;
  if (endIdx > slots.length) return false; // 範囲外

  const reservations = state.reservationsByDate[state.selectedDate] || [];
  const roomReservations = reservations.filter(r => r.room === room && r.reservationId !== excludeId);

  const newStart = slots[startIdx].start;
  const newEnd = slots[endIdx - 1].end;

  // 重複チェック
  for (const r of roomReservations) {
    if (r.startTime < newEnd && r.endTime > newStart) {
      return false; // 重複あり
    }
  }

  return true;
}

async function moveReservation(reservation, newRoom, newStartTime, duration) {
  const slots = state.masters.slots;
  const startIdx = slots.findIndex(s => s.start === newStartTime);
  if (startIdx < 0) {
    toast('移動先が不正です');
    return;
  }

  const endIdx = startIdx + duration;
  if (endIdx > slots.length) {
    toast('予約時間が業務時間を超えます');
    return;
  }

  const newEndTime = slots[endIdx - 1].end;

  // 重複チェック
  if (!checkCanDrop(newRoom, startIdx, endIdx, reservation.reservationId)) {
    toast('この時間帯は既に予約があります');
    return;
  }

  // 同じ位置なら何もしない
  if (reservation.room === newRoom && reservation.startTime === newStartTime) {
    return;
  }

  // 更新APIを呼ぶ
  try {
    const payload = {
      date: state.selectedDate,
      startTime: newStartTime,
      endTime: newEndTime,
      room: newRoom,
      name: reservation.name,
      customerName: reservation.customerName,
      meetingDetail: reservation.meetingDetail
    };

    const res = await gasUpdateReservation(reservation.reservationId, payload);
    if (!res.ok) {
      toast(res.message || '移動に失敗しました');
      return;
    }

    toast('予約を移動しました');

    // キャッシュクリアして再描画
    delete state.reservationsByDate[state.selectedDate];
    await loadDayAndRender(state.selectedDate);

  } catch (e) {
    console.error(e);
    toast('エラー: ' + (e.message || e));
  }
}

// =========================
// Welcome Board
// =========================
let welcomeTimeInterval = null;

function showWelcomeBoard() {
  const r = state.editingReservation;
  if (!r) return;

  // Set welcome board content
  document.getElementById('welcomeRoom').textContent = r.room;

  // Format customer name with automatic "様" suffix
  const customerEl = document.getElementById('welcomeCustomer');
  const waitingEl = document.getElementById('welcomeWaiting');
  const messageEl = document.querySelector('.welcome-message');

  if (r.customerName && r.customerName.trim()) {
    let displayName = r.customerName.trim();
    // Add "様" if not already ending with it
    if (!displayName.endsWith('様') && !displayName.endsWith('さま') && !displayName.endsWith('サマ')) {
      displayName += ' 様';
    }
    customerEl.textContent = displayName;
    customerEl.style.display = '';
    messageEl.style.display = '';
    waitingEl.style.display = 'none';
  } else {
    customerEl.textContent = 'ご来訪者 様';
    customerEl.style.display = '';
    messageEl.style.display = '';
    waitingEl.style.display = 'none';
  }

  // Close detail modal
  closeDetailModal();

  // Generate sparkles
  generateSparkles();

  // Show welcome board
  document.getElementById('welcomeBoard').classList.add('show');

  // Start time update
  updateWelcomeTime();
  welcomeTimeInterval = setInterval(updateWelcomeTime, 1000);
}

function closeWelcomeBoard() {
  document.getElementById('welcomeBoard').classList.remove('show');
  if (welcomeTimeInterval) {
    clearInterval(welcomeTimeInterval);
    welcomeTimeInterval = null;
  }
  // Clear sparkles
  document.getElementById('welcomeSparkles').innerHTML = '';
}

function generateSparkles() {
  const container = document.getElementById('welcomeSparkles');
  container.innerHTML = '';

  // Generate random sparkles
  for (let i = 0; i < 20; i++) {
    const sparkle = document.createElement('div');
    sparkle.className = 'sparkle';
    sparkle.style.left = Math.random() * 100 + '%';
    sparkle.style.top = Math.random() * 100 + '%';
    sparkle.style.animationDelay = (Math.random() * 3) + 's';
    sparkle.style.transform = 'scale(' + (0.5 + Math.random() * 0.8) + ')';
    container.appendChild(sparkle);
  }
}

function updateWelcomeTime() {
  const now = new Date();
  const h = String(now.getHours()).padStart(2, '0');
  const m = String(now.getMinutes()).padStart(2, '0');
  const s = String(now.getSeconds()).padStart(2, '0');
  document.getElementById('welcomeTime').textContent = `${h}:${m}:${s}`;

  // Update date
  const year = now.getFullYear();
  const month = now.getMonth() + 1;
  const day = now.getDate();
  const weekDays = ['日', '月', '火', '水', '木', '金', '土'];
  const dow = weekDays[now.getDay()];
  document.getElementById('welcomeDate').textContent = `${year}年${month}月${day}日(${dow})`;
}

// =========================
// Welcome Auto Display
// =========================
function selectRoomForWelcome(room) {
  // 同じ部屋をクリックしたら選択解除
  if (state.welcomeSelectedRoom === room) {
    state.welcomeSelectedRoom = null;
    state.welcomeAutoEnabled = false;
    stopWelcomeAutoPolling();
    updateWelcomeAutoUI();
    saveWelcomeAutoState();
    renderDayGrid();
    return;
  }

  state.welcomeSelectedRoom = room;
  updateWelcomeAutoUI();
  saveWelcomeAutoState();
  renderDayGrid();
}

function updateWelcomeAutoUI() {
  const bar = document.getElementById('welcomeAutoBar');
  const roomEl = document.getElementById('welcomeAutoRoom');
  const toggle = document.getElementById('welcomeAutoToggle');
  const status = document.getElementById('welcomeAutoStatus');

  if (state.welcomeSelectedRoom) {
    bar.classList.add('show');
    roomEl.textContent = state.welcomeSelectedRoom;

    if (state.welcomeAutoEnabled) {
      toggle.classList.add('on');
      status.textContent = 'ON - 監視中';
    } else {
      toggle.classList.remove('on');
      status.textContent = 'OFF';
    }
  } else {
    bar.classList.remove('show');
  }
}

function toggleWelcomeAuto() {
  if (!state.welcomeSelectedRoom) return;

  state.welcomeAutoEnabled = !state.welcomeAutoEnabled;

  if (state.welcomeAutoEnabled) {
    startWelcomeAutoPolling();
    toast('WELCOME自動表示をONにしました');
  } else {
    stopWelcomeAutoPolling();
    // WELCOMEが表示中なら閉じる
    closeWelcomeBoard();
    toast('WELCOME自動表示をOFFにしました');
  }

  updateWelcomeAutoUI();
  saveWelcomeAutoState();
}

function startWelcomeAutoPolling() {
  // すでに動いていたら停止
  stopWelcomeAutoPolling();

  // 即座に1回チェック
  checkWelcomeAutoSwitch();

  // 30秒ごとにチェック
  state.welcomeAutoInterval = setInterval(checkWelcomeAutoSwitch, 30000);
}

function stopWelcomeAutoPolling() {
  if (state.welcomeAutoInterval) {
    clearInterval(state.welcomeAutoInterval);
    state.welcomeAutoInterval = null;
  }
}

async function checkWelcomeAutoSwitch() {
  if (!state.welcomeAutoEnabled || !state.welcomeSelectedRoom) return;

  const now = new Date();
  const today = ymd(now);

  // 今日の予約を取得（キャッシュまたはAPI）
  if (!state.reservationsByDate[today]) {
    try {
      const list = await gasListReservations(today, today, '');
      state.reservationsByDate[today] = list;
    } catch (e) {
      console.error('予約取得エラー:', e);
      return;
    }
  }

  const reservations = state.reservationsByDate[today] || [];

  // 選択された会議室の予約のみフィルタ
  const roomReservations = reservations.filter(r => r.room === state.welcomeSelectedRoom);

  // 次の予約を探す（現在時刻の30分前〜終了時刻の間にある予約）
  const nextReservation = findNextReservation(roomReservations, now, today);

  if (nextReservation) {
    // お客様名が空の場合はWELCOME表示しない
    if (!nextReservation.customerName || !nextReservation.customerName.trim()) {
      // WELCOMEを表示中なら閉じる
      if (document.getElementById('welcomeBoard').classList.contains('show')) {
        closeWelcomeBoard();
      }
      return;
    }

    // 開始30分前〜終了時刻の間ならWELCOME表示
    const startTime = parseTimeToDate(today, nextReservation.startTime);
    const endTime = parseTimeToDate(today, nextReservation.endTime);
    const threshold = new Date(startTime.getTime() - 30 * 60 * 1000); // 30分前

    if (now >= threshold && now < endTime) {
      // 現在の表示と同じ予約なら何もしない
      if (state.welcomeCurrentReservation?.reservationId === nextReservation.reservationId) {
        return;
      }

      // WELCOME表示
      showWelcomeBoardAuto(nextReservation);
      state.welcomeCurrentReservation = nextReservation;
    } else {
      // 条件外ならDAYビューに戻す
      if (document.getElementById('welcomeBoard').classList.contains('show')) {
        closeWelcomeBoard();
        state.welcomeCurrentReservation = null;
      }
    }
  } else {
    // 予約がない場合もDAYビューに戻す
    if (document.getElementById('welcomeBoard').classList.contains('show')) {
      closeWelcomeBoard();
      state.welcomeCurrentReservation = null;
    }
  }
}

function findNextReservation(reservations, now, today) {
  if (!reservations || reservations.length === 0) return null;

  // 現在時刻以降の予約を時間順にソート
  const sorted = reservations
    .map(r => ({
      ...r,
      startDate: parseTimeToDate(today, r.startTime),
      endDate: parseTimeToDate(today, r.endTime)
    }))
    .filter(r => r.endDate > now) // まだ終わっていない予約
    .sort((a, b) => a.startDate - b.startDate);

  return sorted[0] || null;
}

function parseTimeToDate(dateStr, timeStr) {
  const [h, m] = timeStr.split(':').map(Number);
  const d = new Date(dateStr + 'T00:00:00');
  d.setHours(h, m, 0, 0);
  return d;
}

function showWelcomeBoardAuto(reservation) {
  // Set welcome board content
  document.getElementById('welcomeRoom').textContent = reservation.room;

  // Format customer name with automatic "様" suffix
  const customerEl = document.getElementById('welcomeCustomer');
  const waitingEl = document.getElementById('welcomeWaiting');
  const messageEl = document.querySelector('.welcome-message');

  if (reservation.customerName && reservation.customerName.trim()) {
    let displayName = reservation.customerName.trim();
    // Add "様" if not already ending with it
    if (!displayName.endsWith('様') && !displayName.endsWith('さま') && !displayName.endsWith('サマ')) {
      displayName += ' 様';
    }
    customerEl.textContent = displayName;
    customerEl.style.display = '';
    messageEl.style.display = '';
    waitingEl.style.display = 'none';
  }

  // Generate sparkles
  generateSparkles();

  // Show welcome board
  document.getElementById('welcomeBoard').classList.add('show');

  // Start time update
  updateWelcomeTime();
  if (!welcomeTimeInterval) {
    welcomeTimeInterval = setInterval(updateWelcomeTime, 1000);
  }
}

// localStorage保存/読み込み
function saveWelcomeAutoState() {
  try {
    localStorage.setItem('welcomeAutoEnabled', state.welcomeAutoEnabled ? 'true' : 'false');
    localStorage.setItem('welcomeSelectedRoom', state.welcomeSelectedRoom || '');
  } catch (e) {
    console.error('localStorage保存エラー:', e);
  }
}

function loadWelcomeAutoState() {
  try {
    const enabled = localStorage.getItem('welcomeAutoEnabled') === 'true';
    const room = localStorage.getItem('welcomeSelectedRoom');

    if (room && state.masters.rooms.includes(room)) {
      state.welcomeSelectedRoom = room;
      state.welcomeAutoEnabled = enabled;

      if (enabled) {
        startWelcomeAutoPolling();
      }

      updateWelcomeAutoUI();
      renderDayGrid();
    }
  } catch (e) {
    console.error('localStorage読み込みエラー:', e);
  }
}

// Edit Toggle
// =========================
function initEditToggle() {
  var editToggle = document.getElementById('editToggle');
  var editToggleLabel = document.getElementById('editToggleLabel');
  var gridWrap = document.getElementById('gridWrap');

  editToggle.addEventListener('change', function() {
    var locked = !editToggle.checked;
    gridWrap.classList.toggle('edit-locked', locked);
    editToggleLabel.textContent = locked ? '読み取り専用' : '編集可能';
  });
}

function resetEditToggle() {
  var editToggle = document.getElementById('editToggle');
  var editToggleLabel = document.getElementById('editToggleLabel');
  var gridWrap = document.getElementById('gridWrap');
  editToggle.checked = false;
  editToggleLabel.textContent = '読み取り専用';
  gridWrap.classList.add('edit-locked');
}
