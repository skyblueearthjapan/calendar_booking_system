<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>会議室予約</title>
  <style>
    :root{
      --navy:#0B3A66;
      --navy2:#124A7A;
      --bg:#F5F7FB;
      --card:#FFFFFF;
      --line:#CBD5E1;
      --line-light:#E2E8F0;
      --muted:#6B7280;
      --text:#111827;
      --shadow: 0 4px 12px rgba(17,24,39,.06);
      --radius: 8px;
    }
    *{box-sizing:border-box;margin:0;padding:0}
    body{
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans JP", "Hiragino Kaku Gothic ProN", Meiryo, sans-serif;
      color:var(--text);
      background:var(--bg);
      min-height:100vh;
    }

    /* Header */
    .topbar{
      background: linear-gradient(90deg, var(--navy), var(--navy2));
      color:#fff;
      padding:12px 16px;
      position:sticky;
      top:0;
      z-index:100;
      box-shadow: 0 4px 12px rgba(0,0,0,.15);
    }
    .topbar-inner{
      max-width:1400px;
      margin:0 auto;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      flex-wrap:wrap;
    }
    .brand{
      display:flex;
      align-items:center;
      gap:8px;
      font-weight:800;
      font-size:16px;
    }
    .brand-dot{
      width:10px;height:10px;border-radius:50%;background:#fff;
    }
    .badge{
      font-size:11px;
      padding:3px 8px;
      border:1px solid rgba(255,255,255,.3);
      border-radius:999px;
      opacity:.9;
    }

    /* Week Tabs */
    .week-tabs{
      display:flex;
      gap:4px;
      flex-wrap:wrap;
    }
    .week-tab{
      background:rgba(255,255,255,.1);
      border:1px solid rgba(255,255,255,.2);
      color:#fff;
      padding:6px 10px;
      border-radius:8px;
      cursor:pointer;
      font-size:12px;
      font-weight:700;
      transition:.15s;
      text-align:center;
      min-width:70px;
    }
    .week-tab:hover{background:rgba(255,255,255,.2)}
    .week-tab.active{
      background:#fff;
      color:var(--navy);
      border-color:#fff;
    }
    .week-tab .date{font-size:13px;font-weight:800}
    .week-tab .count{font-size:10px;opacity:.85;margin-top:2px}

    /* Main Container */
    .container{
      max-width:1400px;
      margin:0 auto;
      padding:16px;
    }

    /* Day Info */
    .day-info{
      display:flex;
      align-items:center;
      justify-content:space-between;
      margin-bottom:12px;
      flex-wrap:wrap;
      gap:8px;
    }
    .day-title{
      font-size:18px;
      font-weight:900;
      color:var(--navy);
    }
    .day-nav{
      display:flex;
      gap:6px;
    }
    .nav-btn{
      background:#fff;
      border:1px solid var(--line);
      padding:6px 12px;
      border-radius:6px;
      cursor:pointer;
      font-weight:700;
      font-size:12px;
      transition:.15s;
    }
    .nav-btn:hover{background:var(--bg)}

    /* Grid Table (Excel-like) */
    .grid-wrap{
      background:#fff;
      border:1px solid var(--line);
      border-radius:var(--radius);
      overflow:auto;
      box-shadow:var(--shadow);
    }
    .day-grid{
      display:grid;
      grid-template-columns: 70px repeat(var(--room-count), 1fr);
      min-width:500px;
    }
    .grid-cell{
      border-right:1px solid var(--line);
      border-bottom:1px solid var(--line);
      padding:0;
      min-height:40px;
      position:relative;
      background:#fff;
    }
    .grid-cell:last-child{border-right:none}
    .grid-row:last-child .grid-cell{border-bottom:none}

    /* Header Row */
    .grid-header{
      background:var(--navy);
      color:#fff;
      font-weight:800;
      font-size:13px;
      text-align:center;
      display:flex;
      align-items:center;
      justify-content:center;
      min-height:44px;
      border-bottom:2px solid var(--navy2) !important;
    }

    /* Time Column */
    .time-cell{
      background:#F8FAFC;
      font-weight:800;
      font-size:12px;
      color:#374151;
      display:flex;
      align-items:center;
      justify-content:center;
      border-right:2px solid var(--line) !important;
    }
    .time-cell.half{background:#F1F5F9}

    /* Empty Cell (clickable) */
    .empty-cell{
      cursor:pointer;
      transition:background .1s;
    }
    .empty-cell:hover{
      background:#EEF2FF;
    }
    .empty-cell.half{background:#FAFAFA}
    .empty-cell.half:hover{background:#EEF2FF}

    /* Reservation Cell */
    .res-cell{
      cursor:pointer;
    }
    .res-cell .res-content{
      padding:4px 6px;
      font-size:11px;
      line-height:1.3;
    }
    .res-cell .res-name{font-weight:800;font-size:12px}
    .res-cell .res-time{font-weight:700;opacity:.85}
    .res-cell .res-customer{font-weight:700;margin-top:1px}
    .res-cell .res-detail{color:var(--muted);margin-top:1px}
    .res-cell.continuation{
      /* Middle cells: just color, no text */
    }

    /* Legend */
    .legend{
      display:flex;
      gap:8px;
      margin-top:12px;
      flex-wrap:wrap;
    }
    .legend-item{
      display:flex;
      align-items:center;
      gap:5px;
      font-size:12px;
      font-weight:700;
      background:#fff;
      border:1px solid var(--line);
      padding:4px 10px;
      border-radius:999px;
    }
    .legend-dot{
      width:12px;height:12px;border-radius:3px;
      border:1px solid rgba(0,0,0,.1);
    }

    /* Modal */
    .modal-overlay{
      position:fixed;
      inset:0;
      background:rgba(17,24,39,.5);
      display:none;
      align-items:center;
      justify-content:center;
      z-index:200;
      padding:16px;
    }
    .modal-overlay.show{display:flex}
    .modal{
      background:#fff;
      border-radius:12px;
      width:100%;
      max-width:420px;
      box-shadow:0 20px 50px rgba(0,0,0,.25);
      overflow:hidden;
    }
    .modal-header{
      background:linear-gradient(90deg, var(--navy), var(--navy2));
      color:#fff;
      padding:12px 16px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      font-weight:800;
    }
    .modal-close{
      background:transparent;
      border:1px solid rgba(255,255,255,.3);
      color:#fff;
      width:28px;height:28px;
      border-radius:6px;
      cursor:pointer;
      font-size:16px;
      display:flex;
      align-items:center;
      justify-content:center;
    }
    .modal-close:hover{background:rgba(255,255,255,.1)}
    .modal-body{
      padding:16px;
    }

    /* Form */
    .form-group{margin-bottom:12px}
    .form-label{
      font-size:12px;
      font-weight:800;
      color:var(--navy);
      margin-bottom:4px;
      display:block;
    }
    .form-input, .form-select, .form-textarea{
      width:100%;
      padding:10px 12px;
      border:1px solid var(--line);
      border-radius:8px;
      font-size:14px;
      background:#fff;
      outline:none;
      transition:border .15s;
    }
    .form-input:focus, .form-select:focus, .form-textarea:focus{
      border-color:var(--navy);
    }
    .form-textarea{min-height:80px;resize:vertical}
    .form-row{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:10px;
    }
    .form-hint{font-size:11px;color:var(--muted);margin-top:3px}
    .form-btn{
      width:100%;
      background:var(--navy);
      color:#fff;
      border:none;
      padding:12px;
      border-radius:8px;
      font-weight:800;
      font-size:14px;
      cursor:pointer;
      transition:.15s;
      margin-top:8px;
    }
    .form-btn:hover{filter:brightness(1.1)}
    .form-btn:disabled{opacity:.5;cursor:not-allowed}

    /* Detail Modal */
    .detail-grid{
      display:grid;
      grid-template-columns:100px 1fr;
      gap:8px;
      font-size:14px;
    }
    .detail-grid .label{color:var(--muted);font-weight:700}
    .detail-grid .value{font-weight:600}

    /* Detail Modal Buttons */
    .detail-actions{
      display:flex;
      gap:8px;
      margin-top:16px;
      padding-top:16px;
      border-top:1px solid var(--line);
    }
    .btn-edit{
      flex:1;
      background:var(--navy);
      color:#fff;
      border:none;
      padding:10px;
      border-radius:8px;
      font-weight:700;
      cursor:pointer;
      transition:.15s;
    }
    .btn-edit:hover{filter:brightness(1.1)}
    .btn-delete{
      background:#DC2626;
      color:#fff;
      border:none;
      padding:10px 16px;
      border-radius:8px;
      font-weight:700;
      cursor:pointer;
      transition:.15s;
    }
    .btn-delete:hover{background:#B91C1C}
    .btn-cancel{
      flex:1;
      background:#fff;
      color:var(--text);
      border:1px solid var(--line);
      padding:10px;
      border-radius:8px;
      font-weight:700;
      cursor:pointer;
    }
    .btn-cancel:hover{background:var(--bg)}
    .btn-save{
      flex:1;
      background:#059669;
      color:#fff;
      border:none;
      padding:10px;
      border-radius:8px;
      font-weight:700;
      cursor:pointer;
    }
    .btn-save:hover{background:#047857}
    .btn-save:disabled,.btn-delete:disabled{opacity:.5;cursor:not-allowed}

    /* Confirm Dialog */
    .confirm-overlay{
      position:fixed;
      inset:0;
      background:rgba(17,24,39,.6);
      display:none;
      align-items:center;
      justify-content:center;
      z-index:300;
    }
    .confirm-overlay.show{display:flex}
    .confirm-box{
      background:#fff;
      border-radius:12px;
      padding:20px;
      max-width:320px;
      text-align:center;
      box-shadow:0 20px 50px rgba(0,0,0,.3);
    }
    .confirm-box p{font-weight:700;margin-bottom:16px}
    .confirm-btns{display:flex;gap:10px}
    .confirm-btns button{flex:1;padding:10px;border-radius:8px;font-weight:700;cursor:pointer}
    .confirm-cancel{background:#fff;border:1px solid var(--line);color:var(--text)}
    .confirm-cancel:hover{background:var(--bg)}
    .confirm-ok{background:#DC2626;border:none;color:#fff}
    .confirm-ok:hover{background:#B91C1C}

    /* Toast */
    .toast{
      position:fixed;
      bottom:16px;
      right:16px;
      background:#111827;
      color:#fff;
      padding:10px 16px;
      border-radius:8px;
      font-weight:700;
      font-size:13px;
      box-shadow:0 10px 30px rgba(0,0,0,.2);
      display:none;
      z-index:300;
    }
    .toast.show{display:block}

    /* Responsive */
    @media(max-width:768px){
      .week-tabs{gap:3px}
      .week-tab{min-width:auto;padding:5px 7px;font-size:11px}
      .week-tab .date{font-size:11px}
      .day-grid{grid-template-columns:60px repeat(var(--room-count), minmax(100px, 1fr))}
    }

    /* Welcome Board Styles */
    .welcome-overlay{
      position:fixed;
      inset:0;
      background:linear-gradient(180deg, #0B3A66 0%, #1E5A8A 100%);
      display:none;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      z-index:500;
      color:#fff;
      text-align:center;
      padding:40px;
    }
    .welcome-overlay.show{display:flex}
    .welcome-close{
      position:absolute;
      top:20px;
      right:20px;
      background:rgba(255,255,255,.15);
      border:1px solid rgba(255,255,255,.3);
      color:#fff;
      width:50px;
      height:50px;
      border-radius:12px;
      font-size:24px;
      cursor:pointer;
      display:flex;
      align-items:center;
      justify-content:center;
      transition:.2s;
    }
    .welcome-close:hover{background:rgba(255,255,255,.25)}
    .welcome-room{
      font-size:clamp(48px, 10vw, 96px);
      font-weight:900;
      margin-bottom:20px;
      text-shadow:0 4px 20px rgba(0,0,0,.3);
    }
    .welcome-company{
      font-size:clamp(24px, 5vw, 42px);
      font-weight:700;
      margin-bottom:8px;
      opacity:.95;
    }
    .welcome-subtitle{
      font-size:clamp(16px, 3vw, 24px);
      font-weight:600;
      opacity:.8;
      margin-bottom:50px;
      letter-spacing:.15em;
    }
    .welcome-customer{
      font-size:clamp(36px, 7vw, 64px);
      font-weight:900;
      margin-bottom:30px;
    }
    .welcome-message{
      font-size:clamp(24px, 5vw, 42px);
      font-weight:700;
      line-height:1.6;
    }
    .welcome-time{
      position:absolute;
      bottom:30px;
      right:40px;
      font-size:18px;
      opacity:.7;
    }
    .welcome-waiting{
      font-size:clamp(20px, 4vw, 32px);
      opacity:.8;
      margin-top:40px;
    }
    .btn-welcome{
      background:#10B981;
      color:#fff;
      border:none;
      padding:10px 16px;
      border-radius:8px;
      font-weight:700;
      cursor:pointer;
      transition:.15s;
      margin-right:8px;
    }
    .btn-welcome:hover{background:#059669}
  </style>
</head>
<body>

<!-- Header with Week Tabs -->
<div class="topbar">
  <div class="topbar-inner">
    <div class="brand">
      <div class="brand-dot"></div>
      <span>会議室予約</span>
      <span class="badge">Web入力 / シート表示</span>
    </div>
    <div class="week-tabs" id="weekTabs">
      <!-- 7 day tabs injected -->
    </div>
  </div>
</div>

<!-- Main Content -->
<div class="container">
  <!-- Day Info -->
  <div class="day-info">
    <div class="day-title" id="dayTitle">----</div>
    <div class="day-nav">
      <button class="nav-btn" onclick="shiftDay(-1)">&#9664; 前日</button>
      <button class="nav-btn" onclick="goToday()">今日</button>
      <button class="nav-btn" onclick="shiftDay(1)">翌日 &#9654;</button>
    </div>
  </div>

  <!-- DAY Grid -->
  <div class="grid-wrap">
    <div class="day-grid" id="dayGrid">
      <!-- Grid injected -->
    </div>
  </div>

  <!-- Legend -->
  <div class="legend" id="legend"></div>
</div>

<!-- Reservation Form Modal -->
<div class="modal-overlay" id="formModal">
  <div class="modal" onclick="event.stopPropagation()">
    <div class="modal-header">
      <span>予約入力</span>
      <button class="modal-close" onclick="closeFormModal()">&times;</button>
    </div>
    <div class="modal-body">
      <div class="form-group">
        <label class="form-label">日付</label>
        <input type="date" class="form-input" id="fDate" />
      </div>
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">開始</label>
          <select class="form-select" id="fStart"></select>
        </div>
        <div class="form-group">
          <label class="form-label">終了</label>
          <select class="form-select" id="fEnd"></select>
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">会議室</label>
        <select class="form-select" id="fRoom"></select>
      </div>
      <div class="form-group">
        <label class="form-label">作業者</label>
        <select class="form-select" id="fName"></select>
      </div>
      <div class="form-group">
        <label class="form-label">お客様名（任意）</label>
        <input type="text" class="form-input" id="fCustomer" placeholder="例：株式会社〇〇 ご担当：△△様" />
      </div>
      <div class="form-group">
        <label class="form-label">打ち合わせ内容（任意）</label>
        <textarea class="form-textarea" id="fDetail" placeholder="例：導入説明 / 要件ヒアリング など"></textarea>
      </div>
      <button class="form-btn" id="btnSubmit" onclick="submitReservation()">予約する</button>
      <div class="form-hint" id="formHint"></div>
    </div>
  </div>
</div>

<!-- Detail Modal -->
<div class="modal-overlay" id="detailModal" onclick="closeDetailModal()">
  <div class="modal" onclick="event.stopPropagation()">
    <div class="modal-header">
      <span>予約詳細</span>
      <button class="modal-close" onclick="closeDetailModal()">&times;</button>
    </div>
    <div class="modal-body" id="detailBody">
      <!-- Detail injected -->
    </div>
  </div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<!-- Delete Confirm Dialog -->
<div class="confirm-overlay" id="confirmDialog">
  <div class="confirm-box">
    <p>この予約を削除してよろしいですか？</p>
    <div class="confirm-btns">
      <button class="confirm-cancel" onclick="closeConfirmDialog()">キャンセル</button>
      <button class="confirm-ok" id="confirmDeleteBtn" onclick="executeDelete()">削除する</button>
    </div>
  </div>
</div>

<!-- Welcome Board (Full Screen) -->
<div class="welcome-overlay" id="welcomeBoard">
  <button class="welcome-close" onclick="closeWelcomeBoard()">&times;</button>
  <div class="welcome-room" id="welcomeRoom">第一会議室</div>
  <div class="welcome-company">株式会社LINE WORKS</div>
  <div class="welcome-subtitle">WELCOME BOARD</div>
  <div class="welcome-customer" id="welcomeCustomer">○○会社 ○○様</div>
  <div class="welcome-message">
    ご来社ありがとうございます。<br>
    お待ちしておりました。どうぞお入りください。
  </div>
  <div class="welcome-waiting" id="welcomeWaiting" style="display:none">
    次のご予約をお待ちしています...
  </div>
  <div class="welcome-time" id="welcomeTime">--:--</div>
</div>

<script>
// =========================
// State
// =========================
const state = {
  masters: { names: [], rooms: [], slots: [] },
  window: { today: '', from: '', to: '' },
  selectedDate: '',
  weekDays: [],
  reservationsByDate: {},
  roomColors: {},
  weekCounts: {}, // date -> total count
  editingReservation: null, // 現在編集中の予約
  isEditMode: false // 編集モードかどうか
};

// =========================
// Utils
// =========================
function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

function ymd(d) {
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, '0');
  const day = String(d.getDate()).padStart(2, '0');
  return `${y}-${m}-${day}`;
}

function addDays(dateStr, n) {
  const d = new Date(dateStr + 'T00:00:00');
  d.setDate(d.getDate() + n);
  return ymd(d);
}

function getDayOfWeek(dateStr) {
  const days = ['日', '月', '火', '水', '木', '金', '土'];
  const d = new Date(dateStr + 'T00:00:00');
  return days[d.getDay()];
}

function formatDateShort(dateStr) {
  const parts = dateStr.split('-');
  return `${parseInt(parts[1])}/${parseInt(parts[2])}`;
}

function clampWindow(dateStr) {
  if (dateStr < state.window.from) return state.window.from;
  if (dateStr > state.window.to) return state.window.to;
  return dateStr;
}

function escapeHtml(s) {
  return String(s ?? '')
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

function summarize(text, max = 20) {
  const t = (text || '').trim();
  if (!t) return '';
  return t.length > max ? t.slice(0, max) + '...' : t;
}

// =========================
// GAS Calls
// =========================
function gasGetMasters() {
  return new Promise((res, rej) => {
    google.script.run.withSuccessHandler(res).withFailureHandler(rej).getMasters();
  });
}

function gasGetWindow() {
  return new Promise((res, rej) => {
    google.script.run.withSuccessHandler(res).withFailureHandler(rej).getWindowBase();
  });
}

function gasListReservations(from, to, room) {
  return new Promise((res, rej) => {
    google.script.run.withSuccessHandler(res).withFailureHandler(rej).listReservations(from, to, room || '');
  });
}

function gasCreateReservation(payload) {
  return new Promise((res, rej) => {
    google.script.run.withSuccessHandler(res).withFailureHandler(rej).createReservation(payload);
  });
}

function gasUpdateReservation(reservationId, payload) {
  return new Promise((res, rej) => {
    google.script.run.withSuccessHandler(res).withFailureHandler(rej).updateReservation(reservationId, payload);
  });
}

function gasDeleteReservation(reservationId) {
  return new Promise((res, rej) => {
    google.script.run.withSuccessHandler(res).withFailureHandler(rej).deleteReservation(reservationId);
  });
}

// =========================
// Initialization
// =========================
async function init() {
  try {
    const [masters, win] = await Promise.all([gasGetMasters(), gasGetWindow()]);
    state.masters = masters;
    state.window = win;
    state.selectedDate = win.today;

    // Room colors
    const palette = ['#FDE68A', '#BBF7D0', '#BFDBFE', '#FBCFE8', '#DDD6FE', '#FED7AA'];
    state.masters.rooms.forEach((r, i) => {
      state.roomColors[r] = palette[i % palette.length];
    });

    // Build week days (7 days from today)
    state.weekDays = [];
    for (let i = 0; i < 7; i++) {
      state.weekDays.push(addDays(win.today, i));
    }

    buildFormOptions();
    buildLegend();

    // Load week data for counts
    await loadWeekData();

    // Initial render
    await loadDayAndRender(state.selectedDate);

    toast('初期化完了');
  } catch (e) {
    console.error(e);
    toast('初期化エラー: ' + (e.message || e));
  }
}

// =========================
// Week Data & Tabs
// =========================
async function loadWeekData() {
  const from = state.weekDays[0];
  const to = state.weekDays[state.weekDays.length - 1];
  const all = await gasListReservations(from, to, '');

  // Count per date
  state.weekCounts = {};
  state.weekDays.forEach(d => state.weekCounts[d] = 0);
  all.forEach(r => {
    if (state.weekCounts[r.date] !== undefined) {
      state.weekCounts[r.date]++;
    }
    // Cache reservations
    if (!state.reservationsByDate[r.date]) state.reservationsByDate[r.date] = [];
    const exists = state.reservationsByDate[r.date].find(x => x.reservationId === r.reservationId);
    if (!exists) state.reservationsByDate[r.date].push(r);
  });

  renderWeekTabs();
}

function renderWeekTabs() {
  const container = document.getElementById('weekTabs');
  container.innerHTML = '';

  state.weekDays.forEach(d => {
    const tab = document.createElement('div');
    tab.className = 'week-tab' + (d === state.selectedDate ? ' active' : '');
    tab.onclick = () => selectDate(d);

    const dateLabel = formatDateShort(d) + '(' + getDayOfWeek(d) + ')';
    const count = state.weekCounts[d] || 0;

    tab.innerHTML = `
      <div class="date">${dateLabel}</div>
      <div class="count">${count}件</div>
    `;
    container.appendChild(tab);
  });
}

function selectDate(dateStr) {
  state.selectedDate = clampWindow(dateStr);
  loadDayAndRender(state.selectedDate);
  renderWeekTabs();
}

// =========================
// Day Loading & Rendering
// =========================
async function loadDayAndRender(dateStr) {
  state.selectedDate = dateStr;

  // Check cache or fetch
  if (!state.reservationsByDate[dateStr]) {
    const list = await gasListReservations(dateStr, dateStr, '');
    state.reservationsByDate[dateStr] = list;
  }

  renderDayTitle();
  renderDayGrid();
}

function renderDayTitle() {
  const d = state.selectedDate;
  const dow = getDayOfWeek(d);
  document.getElementById('dayTitle').textContent = `${d} (${dow})`;
}

function renderDayGrid() {
  const grid = document.getElementById('dayGrid');
  const rooms = state.masters.rooms;
  const slots = state.masters.slots;
  const reservations = state.reservationsByDate[state.selectedDate] || [];

  // Set CSS variable for room count
  grid.style.setProperty('--room-count', rooms.length);

  // Build time index map: "09:00" -> 0, "09:30" -> 1, etc.
  const timeIndex = {};
  slots.forEach((s, i) => timeIndex[s.start] = i);

  // Build reservation map: room -> array of {startIdx, endIdx, reservation}
  const resMap = {};
  rooms.forEach(r => resMap[r] = []);

  reservations.forEach(r => {
    const startIdx = timeIndex[r.startTime];
    const endIdx = timeIndex[r.endTime];
    if (startIdx === undefined) return;
    const actualEnd = endIdx !== undefined ? endIdx : slots.length;
    resMap[r.room]?.push({
      startIdx,
      endIdx: actualEnd,
      res: r
    });
  });

  // Clear and rebuild grid
  grid.innerHTML = '';

  // Header row
  const headerRow = document.createElement('div');
  headerRow.className = 'grid-row';
  headerRow.style.display = 'contents';

  const timeHeader = document.createElement('div');
  timeHeader.className = 'grid-cell grid-header';
  timeHeader.textContent = 'Time';
  headerRow.appendChild(timeHeader);

  rooms.forEach(room => {
    const roomHeader = document.createElement('div');
    roomHeader.className = 'grid-cell grid-header';
    roomHeader.textContent = room;
    headerRow.appendChild(roomHeader);
  });
  grid.appendChild(headerRow);

  // Time rows
  slots.forEach((slot, rowIdx) => {
    const row = document.createElement('div');
    row.className = 'grid-row';
    row.style.display = 'contents';

    // Time cell
    const timeCell = document.createElement('div');
    timeCell.className = 'grid-cell time-cell' + (rowIdx % 2 === 1 ? ' half' : '');
    timeCell.textContent = slot.start;
    row.appendChild(timeCell);

    // Room cells
    rooms.forEach(room => {
      const cell = document.createElement('div');
      cell.className = 'grid-cell';
      cell.dataset.room = room;
      cell.dataset.time = slot.start;
      cell.dataset.rowIdx = rowIdx;

      // Check if this cell has a reservation
      const resInfo = resMap[room]?.find(ri => rowIdx >= ri.startIdx && rowIdx < ri.endIdx);

      if (resInfo) {
        const color = state.roomColors[room] || '#E5E7EB';
        cell.style.background = color;
        cell.className += ' res-cell';

        if (rowIdx === resInfo.startIdx) {
          // Start cell: show content
          const r = resInfo.res;
          cell.innerHTML = `
            <div class="res-content">
              <div class="res-name">${escapeHtml(r.name)}</div>
              <div class="res-time">${escapeHtml(r.startTime)}-${escapeHtml(r.endTime)}</div>
              ${r.customerName ? `<div class="res-customer">${escapeHtml(summarize(r.customerName, 15))}</div>` : ''}
              ${r.meetingDetail ? `<div class="res-detail">${escapeHtml(summarize(r.meetingDetail, 20))}</div>` : ''}
            </div>
          `;
          cell.onclick = () => showDetailModal(r);
        } else {
          // Continuation cell: just color
          cell.className += ' continuation';
          cell.onclick = () => showDetailModal(resInfo.res);
        }
      } else {
        // Empty cell
        cell.className += ' empty-cell' + (rowIdx % 2 === 1 ? ' half' : '');
        cell.onclick = () => openFormModal(room, slot.start);
      }

      row.appendChild(cell);
    });

    grid.appendChild(row);
  });
}

// =========================
// Form Modal
// =========================
function buildFormOptions() {
  // Names
  const nameSel = document.getElementById('fName');
  nameSel.innerHTML = '';
  state.masters.names.forEach(n => {
    const opt = document.createElement('option');
    opt.value = n;
    opt.textContent = n;
    nameSel.appendChild(opt);
  });

  // Rooms
  const roomSel = document.getElementById('fRoom');
  roomSel.innerHTML = '';
  state.masters.rooms.forEach(r => {
    const opt = document.createElement('option');
    opt.value = r;
    opt.textContent = r;
    roomSel.appendChild(opt);
  });

  // Times
  const startSel = document.getElementById('fStart');
  const endSel = document.getElementById('fEnd');
  startSel.innerHTML = '';
  endSel.innerHTML = '';

  state.masters.slots.forEach(s => {
    const optS = document.createElement('option');
    optS.value = s.start;
    optS.textContent = s.start;
    startSel.appendChild(optS);

    const optE = document.createElement('option');
    optE.value = s.end;
    optE.textContent = s.end;
    endSel.appendChild(optE);
  });
}

function openFormModal(room, startTime) {
  document.getElementById('fDate').value = state.selectedDate;
  document.getElementById('fRoom').value = room;
  document.getElementById('fStart').value = startTime;

  // End = start + 30min (next slot)
  const idx = state.masters.slots.findIndex(s => s.start === startTime);
  if (idx >= 0 && idx < state.masters.slots.length) {
    document.getElementById('fEnd').value = state.masters.slots[idx].end;
  }

  document.getElementById('fCustomer').value = '';
  document.getElementById('fDetail').value = '';
  document.getElementById('formHint').textContent = '';

  document.getElementById('formModal').classList.add('show');
}

function closeFormModal() {
  document.getElementById('formModal').classList.remove('show');
}

async function submitReservation() {
  const btn = document.getElementById('btnSubmit');
  const hint = document.getElementById('formHint');
  hint.textContent = '';

  const payload = {
    date: document.getElementById('fDate').value,
    startTime: document.getElementById('fStart').value,
    endTime: document.getElementById('fEnd').value,
    room: document.getElementById('fRoom').value,
    name: document.getElementById('fName').value,
    customerName: document.getElementById('fCustomer').value,
    meetingDetail: document.getElementById('fDetail').value
  };

  btn.disabled = true;
  btn.textContent = '登録中...';

  try {
    const res = await gasCreateReservation(payload);
    if (!res.ok) {
      hint.textContent = res.message || '登録に失敗しました';
      toast(res.message || '登録失敗');
      return;
    }

    toast('予約を登録しました');
    closeFormModal();

    // Clear cache and reload
    delete state.reservationsByDate[payload.date];
    await loadDayAndRender(payload.date);

    // Update week counts
    if (state.weekCounts[payload.date] !== undefined) {
      state.weekCounts[payload.date]++;
      renderWeekTabs();
    }
  } catch (e) {
    console.error(e);
    hint.textContent = String(e.message || e);
    toast('エラー: ' + (e.message || e));
  } finally {
    btn.disabled = false;
    btn.textContent = '予約する';
  }
}

// =========================
// Detail Modal (View / Edit)
// =========================
function showDetailModal(r) {
  state.editingReservation = r;
  state.isEditMode = false;
  renderDetailModal();
  document.getElementById('detailModal').classList.add('show');
}

function renderDetailModal() {
  const r = state.editingReservation;
  if (!r) return;

  const body = document.getElementById('detailBody');

  if (state.isEditMode) {
    // 編集モード
    const roomOptions = state.masters.rooms.map(room =>
      `<option value="${escapeHtml(room)}" ${room === r.room ? 'selected' : ''}>${escapeHtml(room)}</option>`
    ).join('');

    const nameOptions = state.masters.names.map(name =>
      `<option value="${escapeHtml(name)}" ${name === r.name ? 'selected' : ''}>${escapeHtml(name)}</option>`
    ).join('');

    const startOptions = state.masters.slots.map(s =>
      `<option value="${s.start}" ${s.start === r.startTime ? 'selected' : ''}>${s.start}</option>`
    ).join('');

    const endOptions = state.masters.slots.map(s =>
      `<option value="${s.end}" ${s.end === r.endTime ? 'selected' : ''}>${s.end}</option>`
    ).join('');

    body.innerHTML = `
      <div class="form-group">
        <label class="form-label">日付</label>
        <input type="date" class="form-input" id="editDate" value="${r.date}" />
      </div>
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">開始</label>
          <select class="form-select" id="editStart">${startOptions}</select>
        </div>
        <div class="form-group">
          <label class="form-label">終了</label>
          <select class="form-select" id="editEnd">${endOptions}</select>
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">会議室</label>
        <select class="form-select" id="editRoom">${roomOptions}</select>
      </div>
      <div class="form-group">
        <label class="form-label">作業者</label>
        <select class="form-select" id="editName">${nameOptions}</select>
      </div>
      <div class="form-group">
        <label class="form-label">お客様名（任意）</label>
        <input type="text" class="form-input" id="editCustomer" value="${escapeHtml(r.customerName || '')}" />
      </div>
      <div class="form-group">
        <label class="form-label">打ち合わせ内容（任意）</label>
        <textarea class="form-textarea" id="editDetail">${escapeHtml(r.meetingDetail || '')}</textarea>
      </div>
      <div class="form-hint" id="editHint"></div>
      <div class="detail-actions">
        <button class="btn-cancel" onclick="cancelEdit()">キャンセル</button>
        <button class="btn-save" id="btnSave" onclick="submitUpdate()">保存する</button>
      </div>
    `;
  } else {
    // 表示モード
    body.innerHTML = `
      <div class="detail-grid">
        <div class="label">日付</div>
        <div class="value">${escapeHtml(r.date)}</div>
        <div class="label">時間</div>
        <div class="value">${escapeHtml(r.startTime)} - ${escapeHtml(r.endTime)}</div>
        <div class="label">会議室</div>
        <div class="value">${escapeHtml(r.room)}</div>
        <div class="label">作業者</div>
        <div class="value">${escapeHtml(r.name)}</div>
        <div class="label">お客様名</div>
        <div class="value">${escapeHtml(r.customerName || '—')}</div>
        <div class="label">打合せ内容</div>
        <div class="value">${escapeHtml(r.meetingDetail || '—')}</div>
      </div>
      <div class="detail-actions">
        <button class="btn-welcome" onclick="showWelcomeBoard()">ウェルカム表示</button>
        <button class="btn-edit" onclick="startEdit()">編集する</button>
        <button class="btn-delete" onclick="confirmDelete()">削除</button>
      </div>
    `;
  }
}

function startEdit() {
  state.isEditMode = true;
  renderDetailModal();
}

function cancelEdit() {
  state.isEditMode = false;
  renderDetailModal();
}

async function submitUpdate() {
  const r = state.editingReservation;
  if (!r) return;

  const btn = document.getElementById('btnSave');
  const hint = document.getElementById('editHint');
  hint.textContent = '';

  const payload = {
    date: document.getElementById('editDate').value,
    startTime: document.getElementById('editStart').value,
    endTime: document.getElementById('editEnd').value,
    room: document.getElementById('editRoom').value,
    name: document.getElementById('editName').value,
    customerName: document.getElementById('editCustomer').value,
    meetingDetail: document.getElementById('editDetail').value
  };

  btn.disabled = true;
  btn.textContent = '保存中...';

  try {
    const res = await gasUpdateReservation(r.reservationId, payload);
    if (!res.ok) {
      hint.textContent = res.message || '更新に失敗しました';
      toast(res.message || '更新失敗');
      return;
    }

    toast('予約を更新しました');
    closeDetailModal();

    // キャッシュクリアして再読み込み
    const oldDate = r.date;
    delete state.reservationsByDate[oldDate];
    delete state.reservationsByDate[payload.date];

    // 週カウントも再取得
    await loadWeekData();
    await loadDayAndRender(state.selectedDate);
  } catch (e) {
    console.error(e);
    hint.textContent = String(e.message || e);
    toast('エラー: ' + (e.message || e));
  } finally {
    btn.disabled = false;
    btn.textContent = '保存する';
  }
}

function confirmDelete() {
  document.getElementById('confirmDialog').classList.add('show');
}

function closeConfirmDialog() {
  document.getElementById('confirmDialog').classList.remove('show');
}

async function executeDelete() {
  const r = state.editingReservation;
  if (!r) return;

  const btn = document.getElementById('confirmDeleteBtn');
  btn.disabled = true;
  btn.textContent = '削除中...';

  try {
    const res = await gasDeleteReservation(r.reservationId);
    if (!res.ok) {
      toast(res.message || '削除に失敗しました');
      return;
    }

    toast('予約を削除しました');
    closeConfirmDialog();
    closeDetailModal();

    // キャッシュクリアして再読み込み
    delete state.reservationsByDate[r.date];

    // 週カウントも更新
    if (state.weekCounts[r.date] !== undefined && state.weekCounts[r.date] > 0) {
      state.weekCounts[r.date]--;
      renderWeekTabs();
    }

    await loadDayAndRender(state.selectedDate);
  } catch (e) {
    console.error(e);
    toast('エラー: ' + (e.message || e));
  } finally {
    btn.disabled = false;
    btn.textContent = '削除する';
  }
}

function closeDetailModal() {
  document.getElementById('detailModal').classList.remove('show');
  state.editingReservation = null;
  state.isEditMode = false;
}

// =========================
// Legend
// =========================
function buildLegend() {
  const container = document.getElementById('legend');
  container.innerHTML = '';
  state.masters.rooms.forEach(room => {
    const color = state.roomColors[room];
    const item = document.createElement('div');
    item.className = 'legend-item';
    item.innerHTML = `<span class="legend-dot" style="background:${color}"></span>${escapeHtml(room)}`;
    container.appendChild(item);
  });
}

// =========================
// Navigation
// =========================
function shiftDay(delta) {
  const next = clampWindow(addDays(state.selectedDate, delta));
  selectDate(next);
}

function goToday() {
  selectDate(state.window.today);
}

// =========================
// Welcome Board
// =========================
let welcomeTimeInterval = null;

function showWelcomeBoard() {
  const r = state.editingReservation;
  if (!r) return;

  // Set welcome board content
  document.getElementById('welcomeRoom').textContent = r.room;
  document.getElementById('welcomeCustomer').textContent = r.customerName || '様';

  // Show/hide waiting message
  const waitingEl = document.getElementById('welcomeWaiting');
  const customerEl = document.getElementById('welcomeCustomer');
  const messageEl = document.querySelector('.welcome-message');

  if (r.customerName) {
    customerEl.style.display = '';
    messageEl.style.display = '';
    waitingEl.style.display = 'none';
  } else {
    customerEl.textContent = '';
    messageEl.style.display = '';
    waitingEl.style.display = 'none';
  }

  // Close detail modal
  closeDetailModal();

  // Show welcome board
  document.getElementById('welcomeBoard').classList.add('show');

  // Start time update
  updateWelcomeTime();
  welcomeTimeInterval = setInterval(updateWelcomeTime, 1000);
}

function closeWelcomeBoard() {
  document.getElementById('welcomeBoard').classList.remove('show');
  if (welcomeTimeInterval) {
    clearInterval(welcomeTimeInterval);
    welcomeTimeInterval = null;
  }
}

function updateWelcomeTime() {
  const now = new Date();
  const h = String(now.getHours()).padStart(2, '0');
  const m = String(now.getMinutes()).padStart(2, '0');
  const s = String(now.getSeconds()).padStart(2, '0');
  document.getElementById('welcomeTime').textContent = `${h}:${m}:${s}`;
}

// =========================
// Start
// =========================
window.addEventListener('load', init);
</script>
